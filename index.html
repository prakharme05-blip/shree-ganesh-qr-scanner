>

<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f5f5f5;

  color: #111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;

  transition:
    background .2s,
    color .2s;

}


.app {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 12px;

}


/* =================================================
   HEADER
   ================================================= */

.header {

  background: #111;

  color: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 8px;

}


.brand {

  font-size: 24px;

  font-weight: 800;

}


.subtitle {

  color: #aaa;

  font-size: 12px;

  margin-top: 4px;

}


.mode {

  color: #ddd;

  font-size: 13px;

  margin-top: 9px;

}


/* =================================================
   THEME
   ================================================= */

.theme-control {

  display: flex;

  justify-content: flex-end;

  gap: 5px;

  margin:
    6px 0 10px;

}


.theme-btn {

  width: auto;

  padding:
    7px 9px;

  background: white;

  color: #555;

  border:
    1px solid #ddd;

  border-radius: 8px;

  font-size: 12px;

}


.theme-btn.active {

  background: #111;

  color: white;

}


/* =================================================
   MAIN ACTIONS
   ================================================= */

.actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;

  margin-bottom: 10px;

}


button {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 14px;

  background: #111;

  color: white;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

}


button:active {

  transform:
    scale(.98);

}


button.secondary {

  background: white;

  color: #111;

  border:
    1px solid #ddd;

}


/* =================================================
   SEARCH
   ================================================= */

.search-box {

  background: white;

  padding: 11px;

  border-radius: 13px;

  margin-bottom: 8px;

}


.search-input {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ddd;

  border-radius: 9px;

  font-size: 16px;

  outline: none;

}


/* =================================================
   ADMIN ENTRY
   ================================================= */

.admin-entry {

  text-align: center;

  margin:
    2px 0 10px;

}


.admin-entry button {

  width: auto;

  background:
    transparent;

  color: #777;

  padding:
    6px 10px;

  font-size: 12px;

}


/* =================================================
   PANELS
   ================================================= */

.panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 10px;

}


.panel-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 9px;

}


.panel-note {

  color: #777;

  font-size: 13px;

  line-height: 1.4;

  margin-bottom: 8px;

}


.input {

  width: 100%;

  padding: 13px;

  border:
    1px solid #ddd;

  border-radius: 9px;

  margin-top: 7px;

  font-size: 15px;

  background: white;

  color: #111;

  outline: none;

}


select.input {

  appearance: auto;

}


.message {

  min-height: 18px;

  margin-top: 8px;

  text-align: center;

  color: #666;

  font-size: 13px;

}


/* =================================================
   OPENING PRODUCT PICKER
   ================================================= */

.opening-product-wrap {

  position: relative;

}


.opening-product-help {

  color: #777;

  font-size: 12px;

  margin-top: 5px;

}


.selected-product {

  display: none;

  background: #f3f3f3;

  border-radius: 10px;

  padding: 10px;

  margin-top: 8px;

  font-size: 13px;

}


.selected-product strong {

  display: block;

  margin-bottom: 3px;

}


/* =================================================
   SCANNER
   ================================================= */

.scanner-panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 11px;

  margin-bottom: 10px;

}


#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 10px;

}


.scanner-status {

  text-align: center;

  color: #666;

  font-size: 13px;

  margin: 8px 0;

}


/* =================================================
   PRODUCT
   ================================================= */

.product-card {

  background: white;

  border-radius: 15px;

  padding: 17px;

  margin-bottom: 9px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.05);

}


.product-name {

  font-size: 21px;

  font-weight: 800;

}


.variant-badge {

  display: inline-block;

  background: #eee;

  border-radius: 8px;

  padding: 6px 9px;

  font-size: 12px;

  font-weight: 800;

  margin-top: 7px;

}


.info {

  color: #666;

  font-size: 13px;

  margin-top: 7px;

}


.info strong {

  color: #111;

}


.stock {

  font-size: 28px;

  font-weight: 800;

  margin-top: 15px;

}


.status {

  margin-top: 3px;

  font-weight: 800;

  font-size: 13px;

}


.green {

  color: #218739;

}


.orange {

  color: #a66500;

}


.red {

  color: #b12626;

}


.scan-next {

  margin-bottom: 10px;

/* =================================================
   QR
   ================================================= */

.qr-panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 10px;

  text-align: center;

}


.qr-title {

  font-size: 19px;

  font-weight: 800;

}


.qr-info {

  color: #666;

  font-size: 13px;

  margin-top: 4px;

}


#qrcode {

  display: flex;

  justify-content: center;

  margin: 16px 0;

}


.qr-actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 7px;

}


/* =================================================
   LOADING / ERROR
   ================================================= */

.loading {

  background: white;

  border-radius: 14px;

  padding: 25px;

  color: #777;

  text-align: center;

}


.error {

  background: #fff0f0;

  color: #a00000;

  padding: 13px;

  border-radius: 11px;

  text-align: center;

}


/* =================================================
   DARK
   ================================================= */

body.dark {

  background: #151515;

  color: #eee;

}


body.dark
.search-box,

body.dark
.panel,

body.dark
.product-card,

body.dark
.scanner-panel,

body.dark
.qr-panel {

  background: #222;

  color: #eee;

}


body.dark
.search-input,

body.dark
.input {

  background: #171717;

  color: #eee;

  border-color: #444;

}


body.dark
button.secondary,

body.dark
.theme-btn {

  color: #eee;

  border-color: #444;

}


body.dark
.info {

}


body.dark
.info strong {

}


body.dark
.variant-badge,

body.dark

/* =================================================

body.highlight

}


body.highlight

    2px;

}


/* =================================================
   MOBILE
   ================================================= */

@media (max-width: 600px) {

  .app {

    padding: 10px;

  }

}

</style>

<script>


// =====================================================
// CONFIG
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyPhd5eC7F9lZoPfJ2KyejFVcah7VC-1k4PfmiP7tP-rmnUrlKPiCa_G_8EfrNk6sf-/exec";


let inventory = [];

let scanner = null;

let scannerRunning = false;

let apiCounter = 0;

let adminToken =
  sessionStorage.getItem(
    "sg_admin_token"
  ) || "";

let currentQRProduct = "";

let currentQRBarcode = "";

let currentQRVariant = "";

let stockMode = "in";

let selectedOpeningBarcode = "";


// =====================================================
// THEME
// =====================================================

function setTheme(
  theme
) {

  document.body
    .classList
    .remove(
      "dark",
      "highlight"
    );


  if (
    theme === "dark"
  ) {

    document.body
      .classList
      .add(
        "dark"
      );
  }


  if (
    theme === "highlight"
  ) {

    document.body
      .classList
      .add(
        "highlight"
      );
  }


  localStorage.setItem(
    "sg_theme",
    theme
  );


  document
    .getElementById(
      "lightButton"
    )
    .classList
    .toggle(
      "active",
      theme === "light"
    );


  document
    .getElementById(
      "darkButton"
    )
    .classList
    .toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById(
      "highlightButton"
    )
    .classList
    .toggle(
      "active",
      theme === "highlight"
    );

}


function loadTheme() {

  setTheme(

    localStorage.getItem(
      "sg_theme"
    ) || "light"

  );

}


// =====================================================
// API CLIENT
// =====================================================

function callApi(
  action,
  params,
  success,
  failure
) {

  params =
    params || {};


  const callbackName =
    "sgApi_" +
    Date.now() +
    "_" +
    (++apiCounter);


  let finished = false;


  const script =
    document.createElement(
      "script"
    );


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  function fail(
    message
  ) {

    if (finished) {

      return;
    }


    finished = true;

    cleanup();


    if (
      typeof failure ===
      "function"
    ) {

      failure({

        message:
          message ||
          "API request failed."

      });

    }

  }


  window[callbackName] =
    function(response) {

      if (finished) {

        return;
      }


      finished = true;

      cleanup();


      if (
        !response ||
        response.success !== true
      ) {

        if (
          typeof failure ===
          "function"
        ) {

          failure({

            message:
              response &&
              response.error
                ? response.error
                : "API request failed."

          });

        }

        return;
      }


      if (
        typeof success ===
        "function"
      ) {

        success(
          response.data
        );

      }

    };


  script.onerror =
    function() {

      fail(
        "Could not connect to inventory."
      );

    };


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "_",
    Date.now()
  );


  Object.keys(
    params
  )
    .forEach(
      function(key) {

        const value =
          params[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  script.src =
    API_URL +
    "?" +
    query.toString();


  document.body
    .appendChild(
      script
    );


  setTimeout(
    function() {

      if (!finished) {

        fail(
          "Inventory server timed out."
        );

      }

    },
    15000
  );

}


// =====================================================
// APP START
// =====================================================

function loadApp() {

  loadTheme();

  loadInventory();

  validateStoredAdmin();

}


// =====================================================
// LOAD INVENTORY
// =====================================================

function loadInventory() {

  document
    .getElementById(
      "results"
    )
    .innerHTML =
      '<div class="loading">Loading inventory...</div>';


  callApi(

    "getInventory",

    {},

    function(data) {

      inventory =
        Array.isArray(data)
          ? data
          : [];


      populateOpeningProducts();

      renderInventory(
        inventory
      );

    },

    function(error) {

      showError(
        error.message ||
        "Could not load inventory."
      );

    }

  );

}


// =====================================================
// POPULATE OPENING PRODUCT SEARCH
// =====================================================

function populateOpeningProducts() {

  const datalist =
    document
      .getElementById(
        "openingProductList"
      );


  datalist.innerHTML =
    "";


  inventory.forEach(
    function(product) {

      const option =
        document.createElement(
          "option"
        );


      /*
       * Product name is what Admin searches.
       *
       * If multiple entries have the same product
       * name, include the variant in the display value.
       */

      let label =
        product.product;


      if (
        product.variant
      ) {

        label +=
          " — " +
          product.variant;

      }


      option.value =
        label;


      option.dataset.barcode =
        product.barcode;


      datalist.appendChild(
        option
      );

    }
  );

}


// =====================================================
// SELECT OPENING PRODUCT
// =====================================================

function selectOpeningProduct() {

  const input =
    document
      .getElementById(
        "openingProductInput"
      );


  const value =
    input.value.trim();


  const selectedBox =
    document
      .getElementById(
        "selectedOpeningProduct"
      );


  selectedOpeningBarcode =
    "";


  selectedBox.style.display =
    "none";


  if (!value) {

    return;
  }


  const option =
    Array.from(
      document
        .getElementById(
          "openingProductList"
        )
        .options
    )
      .find(
        function(item) {

          return item.value ===
            value;

        }
      );


  if (!option) {

    return;
  }


  selectedOpeningBarcode =
    option.dataset.barcode ||
    "";


  const product =
    inventory.find(
      function(item) {

        return (
          String(
            item.barcode
          ) ===
          String(
            selectedOpeningBarcode
          )
        );

      }
    );


  if (!product) {

    return;
  }


  selectedBox.innerHTML = `

    <strong>
      ${escapeHTML(
        product.product
      )}
    </strong>

    ${
      product.variant
        ? escapeHTML(
            product.variant
          ) +
          " · "
        : ""
    }

    Current stock:
    ${Number(product.stock) || 0}

  `;


  selectedBox.style.display =
    "block";

}


// =====================================================
// STATUS
// =====================================================

function getStatus(
  product
) {

  const stock =
    Number(
      product.stock
    ) || 0;


  const minimum =
    Number(
      product.minimumStock
    ) || 0;


  if (
    stock <= 0
  ) {

    return {

      text:
        "OUT OF STOCK",

      cls:
        "red"

    };

  }


  if (
    minimum > 0 &&
    stock <= minimum
  ) {

    return {

      text:
        "LOW STOCK",

      cls:
        "orange"

    };

  }


  return {

    text:
      "IN STOCK",

    cls:
      "green"

  };

}


// =====================================================
// VARIANT BADGE
// =====================================================

function variantHTML(
  variant
) {

  if (!variant) {

    return "";
  }


  let icon = "";


  if (
    variant === "Light"
  ) {

    icon = "☀️";

  }

  else if (
    variant === "Dark"
  ) {

    icon = "🌙";

  }

  else if (
    variant === "Highlight"
  ) {

    icon = "🖍️";

  }


  return `

    <div class="variant-badge">

      ${icon}
      ${escapeHTML(
        variant
      )}

    </div>

  `;
}


// =====================================================
// PRODUCT CARD

function productCard(

  const status =

  const stock =

  return `

// =====================================================
// RENDER INVENTORY
// =====================================================

function renderInventory(

  const results =

  if (

// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;
  }


  if (scanner) {

    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );
    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label ||
          ""
        )
          .toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;
      }

    }


    await scanner.start(

      cameraId,

      {
        fps:
          10,

        qrbox: {
          width:
            250,

          height:
            250
        },

        aspectRatio:
          1
      },

      function(decodedText) {

        handleQR(
          decodedText
        );

      },

      function() {

        // Ignore normal scanner errors.

      }

    );


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
        "Point camera at QR code.";

  }


  catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Camera could not start. Please allow camera access.";

  }

}


// =====================================================
// HANDLE QR
// =====================================================

async function handleQR(
  decodedText
) {

  if (
    !scannerRunning
  ) {

    return;
  }


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if (!barcode) {

    return;
  }


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
      "Finding product...";


  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {}

  }


  scannerRunning =
    false;


  document
    .getElementById(
      "adminBarcode"
    )
    .value =
      barcode;


  const local =
    inventory.find(
      function(product) {

        return String(
          product.barcode ||
          ""
        )
          .trim()
          .toLowerCase() ===
          barcode.toLowerCase();

      }
    );


  if (local) {

    showProduct(
      local
    );

    closeScannerPanel();

    return;
  }


  callApi(

    "findProduct",

    {

      barcode:
        barcode

    },

    function(product) {

      if (!product) {

        closeScannerPanel();

        showError(
          "Product not found: " +
          barcode
        );

        return;
      }


      inventory.push(
        product
      );


      populateOpeningProducts();


      showProduct(
        product
      );


      closeScannerPanel();

    },

    function(error) {

      closeScannerPanel();

      showError(
        error.message ||
        "Could not find product."
      );

    }

  );
}

      openingStock

    openingStock < 0
  ) {

    return;

  message.textContent =

  callApi(

    "openingStock",

      barcode:

      openingStock:

      token:

        result.newStock;


      document
        .getElementById(
          "openingQuantity"
        )
        .value =
        "";


      /*
       * Keep selected product so the Admin
       * can quickly enter/fix the same item.

      loadInventory();

    },

    function(error) {

      message.textContent =
        error.message ||
        "Could not save opening stock.";


      handleAdminError(

        .value
    );


  const minimumStock =
    Number(
      document
        .getElementById(
          "newMinimumStock"
        )
        .value
    );


  const message =
    document
      .getElementById(
        "newMaterialMessage"
      );


  if (!barcode) {

    message.textContent =
      "Generate or enter a barcode.";

    return;
  }


  if (!product) {

    message.textContent =
      "Product name is required.";

    return;
  }


  if (
    !Number.isFinite(
      openingStock
    ) ||
    openingStock < 0
  ) {

    message.textContent =
      "Enter a valid opening stock.";

    return;
  }


  if (
    !Number.isFinite(
      minimumStock
    ) ||
    minimumStock < 0
  ) {

    message.textContent =
      "Enter a valid minimum stock.";

    return;
  }


  message.textContent =
    "Saving material...";


  callApi(

    "createProduct",

    {

      barcode:
        barcode,

      product:
        product,

      brand:
        brand,

      size:
        size,

      finish:
        finish,

      openingStock:
        openingStock,

      minimumStock:
        minimumStock,

      variant:
        variant,

      token:
        adminToken

    },

    function(result) {

      message.textContent =
        "Material added successfully.";


      generateProductQR(

        result.product,

        result.barcode,

        result.variant

      );


      clearNewMaterialForm();


      loadInventory();

    },

    function(error) {

      message.textContent =
        error.message ||
        "Could not add material.";


      handleAdminError(
        error
      );

    }

  );

}

// =====================================================
// QR GENERATION
// =====================================================

function generateProductQR(
  productName,
  barcode,
  variant
) {

  currentQRProduct =
    productName ||
    "Product";


  currentQRBarcode =
    barcode ||
    "";


  currentQRVariant =
    variant ||
    "";


  document
    .getElementById(
      "qrTitle"
    )
    .textContent =
      currentQRProduct;


  document
    .getElementById(
      "qrVariant"
    )
    .textContent =
      variant
        ? "Variant: " +
          variant
        : "";


  document
    .getElementById(
      "qrBarcode"
    )
    .textContent =
      "Barcode: " +
      currentQRBarcode;


  const qrBox =
    document
      .getElementById(
        "qrcode"
      );


  qrBox.innerHTML =
    "";


  if (
    typeof QRCode ===
    "undefined"
  ) {

    document
      .getElementById(
        "qrPanel"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "qrBarcode"
      )
      .textContent =
        "QR generator could not load.";

    return;
  }


  new QRCode(

    qrBox,

    {

      text:
        String(
          currentQRBarcode
        ),

      width:
        220,

      height:
        220,

      correctLevel:
        QRCode.CorrectLevel.H

    }

  );


  document
    .getElementById(
      "qrPanel"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "qrPanel"
    )
    .scrollIntoView({
      behavior:
        "smooth",
      block:
        "center"
    });

}


// =====================================================
// CLOSE QR
// =====================================================

function closeQR() {

  document
    .getElementById(
      "qrPanel"
    )
    .style.display =
      "none";

}


// =====================================================
// GET QR DATA
// =====================================================

function getQRDataURL_() {

  const canvas =
    document.querySelector(
      "#qrcode canvas"
    );


  if (canvas) {

    return canvas.toDataURL(
      "image/png"
    );
  }


  const img =
    document.querySelector(
      "#qrcode img"
    );


  if (img) {

    return img.src;
  }


  return "";
}


// =====================================================
// DOWNLOAD QR
// =====================================================

function downloadQR() {

  const dataURL =
    getQRDataURL_();


  if (!dataURL) {

    alert(
      "QR code is not ready."
    );

    return;
  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    dataURL;


  link.download =
    (
      currentQRBarcode ||
      "product"
    ) +
    "-QR.png";


  document.body
    .appendChild(
      link
    );


  link.click();

  link.remove();

}

// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
