<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<meta
  name="theme-color"
  content="#111111"
>

<title>
  SHREE GANESH Inventory
</title>


<!-- =================================================
     QR SCANNER
     ================================================= -->

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<!-- =================================================
     QR GENERATOR
     ================================================= -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>


<style>

/* =================================================
   BASE
   ================================================= */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  background: #f5f5f5;

  color: #111;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height: 100vh;

  transition:
    background .2s,
    color .2s;

}


.app {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 12px;

}


/* =================================================
   HEADER
   ================================================= */

.header {

  background: #111;

  color: white;

  border-radius: 16px;

  padding: 18px;

  margin-bottom: 8px;

}


.brand {

  font-size: 24px;

  font-weight: 800;

}


.subtitle {

  color: #aaa;

  font-size: 12px;

  margin-top: 4px;

}


.mode {

  color: #ddd;

  font-size: 13px;

  margin-top: 9px;

}


/* =================================================
   THEME
   ================================================= */

.theme-control {

  display: flex;

  justify-content: flex-end;

  gap: 5px;

  margin: 6px 0 10px;

}


.theme-btn {

  width: auto;

  padding: 7px 9px;

  background: white;

  color: #555;

  border: 1px solid #ddd;

  border-radius: 8px;

  font-size: 12px;

}


.theme-btn.active {

  background: #111;

  color: white;

}


/* =================================================
   BUTTONS
   ================================================= */

button {

  width: 100%;

  border: none;

  border-radius: 11px;

  padding: 14px;

  background: #111;

  color: white;

  font-size: 14px;

  font-weight: 800;

  cursor: pointer;

}


button:active {

  transform: scale(.98);

}


button.secondary {

  background: white;

  color: #111;

  border: 1px solid #ddd;

}


/* =================================================
   MAIN SCAN
   ================================================= */

.actions {

  display: grid;

  grid-template-columns: 1fr;

  gap: 9px;

  margin-bottom: 10px;

}


/* =================================================
   MAIN SEARCH
   ================================================= */

.search-box {

  background: white;

  padding: 11px;

  border-radius: 13px;

  margin-bottom: 8px;

}


.search-input {

  width: 100%;

  padding: 13px;

  border: 1px solid #ddd;

  border-radius: 9px;

  font-size: 16px;

  outline: none;

  background: white;

  color: #111;

}


/* =================================================
   FILTER TABS
   ================================================= */

.filter-tabs {

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  gap: 6px;

  margin-bottom: 10px;

}


.filter-tab {

  width: 100%;

  padding: 10px 7px;

  background: white;

  color: #666;

  border: 1px solid #ddd;

  border-radius: 9px;

  font-size: 12px;

  font-weight: 700;

}


.filter-tab.active {

  background: #111;

  color: white;

  border-color: #111;

}


/* =================================================
   ADMIN ENTRY
   ================================================= */

.admin-entry {

  text-align: center;

  margin: 2px 0 10px;

}


.admin-entry button {

  width: auto;

  background: transparent;

  color: #777;

  padding: 6px 10px;

  font-size: 12px;

}


/* =================================================
   PANELS
   ================================================= */

.panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 15px;

  margin-bottom: 10px;

}


.panel-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 9px;

}


.panel-note {

  color: #777;

  font-size: 13px;

  line-height: 1.4;

  margin-bottom: 8px;

}


.input {

  width: 100%;

  padding: 13px;

  border: 1px solid #ddd;

  border-radius: 9px;

  margin-top: 7px;

  font-size: 15px;

  background: white;

  color: #111;

  outline: none;

}


select.input {

  appearance: auto;

}


.message {

  min-height: 18px;

  margin-top: 8px;

  text-align: center;

  color: #666;

  font-size: 13px;

}


/* =================================================
   ADMIN GRID
   ================================================= */

.admin-grid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 8px;

}


.admin-opening {

  background: #111;

}


.admin-stock-in {

  background: #238636;

}


.admin-stock-in:hover {

  background: #1c702d;

}


.admin-stock-out {

  background: #c62828;

}


.admin-stock-out:hover {

  background: #a91f1f;

}


/* =================================================
   STOCK PRODUCT SEARCH
   ================================================= */

.stock-product-search {

  position: relative;

}


.stock-search-results {

  display: none;

  margin-top: 7px;

  border: 1px solid #ddd;

  border-radius: 10px;

  overflow: hidden;

  background: white;

  max-height: 250px;

  overflow-y: auto;

}


.stock-result {

  width: 100%;

  text-align: left;

  border-radius: 0;

  background: white;

  color: #111;

  border-bottom: 1px solid #eee;

  padding: 12px;

  font-size: 13px;

  font-weight: 600;

}


.stock-result:last-child {

  border-bottom: none;

}


.stock-result:hover {

  background: #f5f5f5;

}


.stock-result-name {

  font-weight: 800;

}


.stock-result-meta {

  display: block;

  margin-top: 4px;

  color: #777;

  font-size: 11px;

  font-weight: 500;

}


/* =================================================
   SELECTED STOCK PRODUCT
   ================================================= */

.selected-stock-product {

  display: none;

  background: #f3f3f3;

  border-radius: 11px;

  padding: 12px;

  margin-top: 8px;

}


.selected-stock-name {

  font-size: 16px;

  font-weight: 800;

}


.selected-stock-meta {

  font-size: 12px;

  color: #666;

  margin-top: 4px;

}


.current-stock {

  font-size: 22px;

  font-weight: 800;

  margin-top: 8px;

}


.current-stock-unit {

  font-size: 12px;

  color: #777;

  font-weight: 600;

}


/* =================================================
   STOCK ACTIONS
   ================================================= */

.stock-scan-btn {

  margin-top: 8px;

}


.stock-cancel {

  margin-top: 7px;

}


/* =================================================
   OPENING STOCK PRODUCT PICKER
   ================================================= */

.opening-product-wrap {

  position: relative;

}


.selected-product {

  display: none;

  background: #f3f3f3;

  border-radius: 10px;

  padding: 10px;

  margin-top: 8px;

  font-size: 13px;

}


.selected-product strong {

  display: block;

  margin-bottom: 3px;

}


/* =================================================
   SCANNER
   ================================================= */

.scanner-panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 11px;

  margin-bottom: 10px;

}


#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 10px;

}


.scanner-status {

  text-align: center;

  color: #666;

  font-size: 13px;

  margin: 8px 0;

}


/* =================================================
   PRODUCT CARD
   ================================================= */

.product-card {

  background: white;

  border-radius: 15px;

  padding: 17px;

  margin-bottom: 9px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.05);

}


.product-name {

  font-size: 21px;

  font-weight: 800;

}


.variant-badge {

  display: inline-block;

  background: #eee;

  border-radius: 8px;

  padding: 6px 9px;

  font-size: 12px;

  font-weight: 800;

  margin-top: 7px;

}


.info {

  color: #666;

  font-size: 13px;

  margin-top: 7px;

}


.info strong {

  color: #111;

}


.stock {

  font-size: 28px;

  font-weight: 800;

  margin-top: 15px;

}


.stock-unit {

  font-size: 13px;

  font-weight: 600;

  color: #777;

}


.status {

  margin-top: 3px;

  font-weight: 800;

  font-size: 13px;

}


.green {

  color: #218739;

}


.orange {

  color: #a66500;

}


.red {

  color: #b12626;

}


/* =================================================
   LOW STOCK
   ================================================= */

.low-stock-badge {

  display: inline-block;

  margin-top: 7px;

  padding: 6px 9px;

  border-radius: 8px;

  background: #fff2d6;

  color: #9a6100;

  font-size: 11px;

  font-weight: 800;

}


.scan-next {

  margin-bottom: 10px;

}


/* =================================================
   QR
   ================================================= */

.qr-panel {

  display: none;

  background: white;

  border-radius: 15px;

  padding: 18px;

  margin-bottom: 10px;

  text-align: center;

}


.qr-title {

  font-size: 19px;

  font-weight: 800;

}


.qr-info {

  color: #666;

  font-size: 13px;

  margin-top: 4px;

}


#qrcode {

  display: flex;

  justify-content: center;

  margin: 16px 0;

}


.qr-actions {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 7px;

}


/* =================================================
   LOADING / ERROR
   ================================================= */

.loading {

  background: white;

  border-radius: 14px;

  padding: 25px;

  color: #777;

  text-align: center;

}


.error {

  background: #fff0f0;

  color: #a00000;

  padding: 13px;

  border-radius: 11px;

  text-align: center;

}


/* =================================================
   DARK MODE
   ================================================= */

body.dark {

  background: #151515;

  color: #eee;

}


body.dark
.search-box,

body.dark
.panel,

body.dark
.product-card,

body.dark
.scanner-panel,

body.dark
.qr-panel {

  background: #222;

  color: #eee;

}


body.dark
.search-input,

body.dark
.input {

  background: #171717;

  color: #eee;

  border-color: #444;

}


body.dark
button.secondary,

body.dark
.theme-btn,

body.dark
.filter-tab {

  background: #222;

  color: #eee;

  border-color: #444;

}


body.dark
.filter-tab.active {

  background: #fff;

  color: #111;

  border-color: #fff;

}


body.dark
.info {

  color: #bbb;

}


body.dark
.info strong {

  color: #eee;

}


body.dark
.variant-badge,

body.dark
.selected-product,

body.dark
.selected-stock-product {

  background: #333;

}


body.dark
.stock-search-results {

  background: #222;

  border-color: #444;

}


body.dark
.stock-result {

  background: #222;

  color: #eee;

  border-color: #444;

}


body.dark
.stock-result:hover {

  background: #333;

}


body.dark
.stock-result-meta,

body.dark
.selected-stock-meta,

body.dark
.current-stock-unit {

  color: #aaa;

}


body.dark
.low-stock-badge {

  background: #4b3920;

  color: #ffd98a;

}


/* =================================================
   HIGHLIGHT MODE
   ================================================= */

body.highlight
.product-card {

  border-left:
    6px solid #e1a900;

}


body.highlight
.stock {

  text-decoration:
    underline;

  text-decoration-thickness:
    2px;

}


/* =================================================
   MOBILE
   ================================================= */

@media (
  max-width: 600px
) {

  .app {

    padding: 10px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- =================================================
     HEADER
     ================================================= -->

<div class="header">

  <div class="brand">
    SHREE GANESH
  </div>

  <div class="subtitle">
    MARBLES AND GRANITES · INVENTORY
  </div>

  <div
    id="modeText"
    class="mode">

    Staff Mode

  </div>

</div>


<!-- =================================================
     THEME
     ================================================= -->

<div class="theme-control">

  <button
    id="lightButton"
    class="theme-btn active"
    onclick="setTheme('light')">

    ☀️

  </button>


  <button
    id="darkButton"
    class="theme-btn"
    onclick="setTheme('dark')">

    🌙

  </button>


  <button
    id="highlightButton"
    class="theme-btn"
    onclick="setTheme('highlight')">

    🖍️

  </button>

</div>


<!-- =================================================
     MAIN SCAN
     ================================================= -->

<div class="actions">

  <button
    onclick="openScanner()">

    📷 SCAN QR

  </button>

</div>


<!-- =================================================
     MAIN SEARCH
     ================================================= -->

<div class="search-box">

  <input
    id="searchInput"
    class="search-input"
    placeholder="Search product or barcode..."
    autocomplete="off"
    oninput="searchProducts()"
  >

</div>


<!-- =================================================
     FILTER TABS
     ================================================= -->

<div class="filter-tabs">

  <button
    id="filterAll"
    class="filter-tab active"
    onclick="setStockFilter('all')">

    All

  </button>


  <button
    id="filterInStock"
    class="filter-tab"
    onclick="setStockFilter('in')">

    In Stock

  </button>


  <button
    id="filterOutStock"
    class="filter-tab"
    onclick="setStockFilter('out')">

    Out of Stock

  </button>

</div>


<!-- =================================================
     ADMIN ENTRY
     ================================================= -->

<div
  id="adminEntry"
  class="admin-entry">

  <button
    onclick="showAdminLogin()">

    🔐 Admin

  </button>

</div>


<!-- =================================================
     LOGIN
     ================================================= -->

<div
  id="loginPanel"
  class="panel">

  <div class="panel-title">
    Admin Login
  </div>


  <input
    id="adminPin"
    class="input"
    type="password"
    inputmode="numeric"
    maxlength="8"
    placeholder="Admin PIN"
    autocomplete="off"
  >


  <button
    style="margin-top:8px;"
    onclick="adminLogin()">

    UNLOCK ADMIN

  </button>


  <button
    class="secondary"
    style="margin-top:7px;"
    onclick="closeAdminLogin()">

    CANCEL

  </button>


  <div
    id="loginMessage"
    class="message">
  </div>

</div>


<!-- =================================================
     SCANNER
     ================================================= -->

<div
  id="scannerPanel"
  class="scanner-panel">

  <div id="reader"></div>


  <div
    id="scannerStatus"
    class="scanner-status">

    Point camera at QR code.

  </div>


  <button
    class="secondary"
    onclick="closeScanner()">

    CLOSE

  </button>

</div>


<!-- =================================================
     ADMIN PANEL
     ================================================= -->

<div
  id="adminPanel"
  class="panel">

  <div class="panel-title">
    👑 Admin
  </div>


  <div class="admin-grid">

    <button
      class="admin-opening"
      onclick="showOpeningStock()">

      📦 OPENING STOCK

    </button>


    <button
      class="admin-stock-in"
      onclick="showStockIn()">

      ➕ STOCK IN

    </button>


    <button
      class="admin-stock-out"
      onclick="showStockOut()">

      ➖ STOCK OUT

    </button>


    <button
      class="secondary"
      onclick="showAddMaterial()">

      ➕ ADD NEW MATERIAL

    </button>


    <button
      class="secondary"
      onclick="adminLogout()">

      LOG OUT

    </button>

  </div>

</div>


<!-- =================================================
     OPENING STOCK
     ================================================= -->

<div
  id="openingStockPanel"
  class="panel">

  <div class="panel-title">

    📦 Opening Stock

  </div>


  <div class="panel-note">

    Search the product by name and enter
    the physical quantity from your register.

  </div>


  <div class="opening-product-wrap">

    <input
      id="openingProductInput"
      class="input"
      list="openingProductList"
      placeholder="Search product name..."
      autocomplete="off"
      oninput="selectOpeningProduct()"
    >


    <datalist
      id="openingProductList">
    </datalist>


    <div
      id="selectedOpeningProduct"
      class="selected-product">
    </div>

  </div>


  <input
    id="openingQuantity"
    class="input"
    type="number"
    min="0"
    step="1"
    placeholder="Physical opening stock"
  >


  <button
    style="margin-top:8px;"
    onclick="saveOpeningStock()">

    SAVE OPENING STOCK

  </button>


  <button
    class="secondary"
    style="margin-top:7px;"
    onclick="closeOpeningStock()">

    CANCEL

  </button>


  <div
    id="openingMessage"
    class="message">
  </div>

</div>


<!-- =================================================
     STOCK IN / OUT PANEL
     ================================================= -->

<div
  id="stockPanel"
  class="panel">

  <div
    id="stockTitle"
    class="panel-title">

    Stock Update

  </div>


  <!-- PRODUCT SEARCH -->

  <div class="stock-product-search">

    <input
      id="stockProductSearch"
      class="input"
      placeholder="Search product or barcode..."
      autocomplete="off"
      oninput="searchStockProducts()"
    >


    <div
      id="stockSearchResults"
      class="stock-search-results">
    </div>

  </div>


  <!-- SELECTED PRODUCT -->

  <div
    id="selectedStockProduct"
    class="selected-stock-product">

    <div
      id="selectedStockName"
      class="selected-stock-name">
    </div>


    <div
      id="selectedStockMeta"
      class="selected-stock-meta">
    </div>


    <div
      id="selectedCurrentStock"
      class="current-stock">
    </div>

  </div>


  <!-- QR SCAN -->

  <button
    class="secondary stock-scan-btn"
    onclick="openStockScanner()">

    📷 SCAN QR

  </button>


  <!-- QUANTITY -->

  <input
    id="stockQuantity"
    class="input"
    type="number"
    min="1"
    step="1"
    placeholder="Quantity"
  >


  <!-- STOCK ACTIONS -->

  <button
    id="stockInButton"
    class="admin-stock-in"
    style="margin-top:8px;"
    onclick="stockIn()">

    ➕ STOCK IN

  </button>


  <button
    id="stockOutButton"
    class="admin-stock-out"
    style="margin-top:8px;"
    onclick="stockOut()">

    ➖ STOCK OUT

  </button>


  <button
    class="secondary stock-cancel"
    onclick="closeStockPanel()">

    CANCEL

  </button>


  <div
    id="adminMessage"
    class="message">
  </div>

</div>


<!-- =================================================
     ADD NEW MATERIAL
     ================================================= -->

<div
  id="newMaterialPanel"
  class="panel">

  <div class="panel-title">

    Add New Material

  </div>


  <input
    id="newBarcode"
    class="input"
    placeholder="Barcode"
    autocomplete="off"
  >


  <button
    class="secondary"
    style="margin-top:7px;"
    onclick="generateInternalBarcode()">

    ⚡ GENERATE INTERNAL CODE

  </button>


  <input
    id="newProduct"
    class="input"
    placeholder="Product name *"
    autocomplete="off"
  >


  <input
    id="newBrand"
    class="input"
    placeholder="Brand"
    autocomplete="off"
  >


  <input
    id="newSize"
    class="input"
    placeholder="Size"
    autocomplete="off"
  >


  <input
    id="newFinish"
    class="input"
    placeholder="Finish"
    autocomplete="off"
  >


  <select
    id="newVariant"
    class="input">

    <option value="">
      Variant
    </option>

    <option value="Light">
      ☀️ Light
    </option>

    <option value="Dark">
      🌙 Dark
    </option>

    <option value="Highlight">
      🖍️ Highlight
    </option>

  </select>


  <input
    id="newOpeningStock"
    class="input"
    type="number"
    min="0"
    step="1"
    placeholder="Opening stock"
  >


  <input
    id="newMinimumStock"
    class="input"
    type="number"
    min="0"
    step="1"
    placeholder="Minimum stock"
  >


  <button
    style="margin-top:8px;"
    onclick="createNewMaterial()">

    SAVE NEW MATERIAL

  </button>


  <button
    class="secondary"
    style="margin-top:7px;"
    onclick="closeNewMaterial()">

    CANCEL

  </button>


  <div
    id="newMaterialMessage"
    class="message">
  </div>

</div>


<!-- =================================================
     QR RESULT
     ================================================= -->

<div
  id="qrPanel"
  class="qr-panel">

  <div
    id="qrTitle"
    class="qr-title">
  </div>


  <div
    id="qrVariant"
    class="qr-info">
  </div>


  <div
    id="qrBarcode"
    class="qr-info">
  </div>


  <div id="qrcode"></div>


  <div class="qr-actions">

    <button
      onclick="printQRLabel()">

      🖨️ PRINT

    </button>


    <button
      class="secondary"
      onclick="downloadQR()">

      ⬇️ SAVE

    </button>

  </div>


  <button
    class="secondary"
    style="margin-top:7px;"
    onclick="closeQR()">

    CLOSE

  </button>

</div>


<!-- =================================================
     RESULTS
     ================================================= -->

<div
  id="results">

  <div class="loading">

    Loading inventory...

  </div>

</div>


</div>


<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyPhd5eC7F9lZoPfJ2KyejFVcah7VC-1k4PfmiP7tP-rmnUrlKPiCa_G_8EfrNk6sf-/exec";


const STOCK_UNIT =
  "units";


let inventory = [];

let scanner = null;

let scannerRunning = false;

let apiCounter = 0;

let adminToken =
  sessionStorage.getItem(
    "sg_admin_token"
  ) || "";

let currentQRProduct = "";

let currentQRBarcode = "";

let currentQRVariant = "";

let stockMode = "in";

let selectedOpeningBarcode = "";

let selectedStockBarcode = "";

let activeStockFilter = "all";


/*
 * "normal"  = main product scanner
 * "stock"   = Stock In / Stock Out scanner
 */

let scannerMode = "normal";


/* =====================================================
   THEME
   ===================================================== */

function setTheme(theme) {

  document.body.classList.remove(
    "dark",
    "highlight"
  );


  if (theme === "dark") {

    document.body.classList.add(
      "dark"
    );

  }


  if (theme === "highlight") {

    document.body.classList.add(
      "highlight"
    );

  }


  localStorage.setItem(
    "sg_theme",
    theme
  );


  document
    .getElementById(
      "lightButton"
    )
    .classList.toggle(
      "active",
      theme === "light"
    );


  document
    .getElementById(
      "darkButton"
    )
    .classList.toggle(
      "active",
      theme === "dark"
    );


  document
    .getElementById(
      "highlightButton"
    )
    .classList.toggle(
      "active",
      theme === "highlight"
    );

}


function loadTheme() {

  setTheme(
    localStorage.getItem(
      "sg_theme"
    ) || "light"
  );

}


/* =====================================================
   API CLIENT
   ===================================================== */

function callApi(
  action,
  params,
  success,
  failure
) {

  params =
    params || {};


  const callbackName =
    "sgApi_" +
    Date.now() +
    "_" +
    (++apiCounter);


  let finished =
    false;


  const script =
    document.createElement(
      "script"
    );


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  function fail(message) {

    if (finished) {

      return;

    }


    finished =
      true;


    cleanup();


    if (
      typeof failure ===
      "function"
    ) {

      failure({

        message:
          message ||
          "API request failed."

      });

    }

  }


  window[callbackName] =
    function(response) {

      if (finished) {

        return;

      }


      finished =
        true;


      cleanup();


      if (
        !response ||
        response.success !== true
      ) {

        if (
          typeof failure ===
          "function"
        ) {

          failure({

            message:

              response &&
              response.error

                ? response.error

                : "API request failed."

          });

        }

        return;

      }


      if (
        typeof success ===
        "function"
      ) {

        success(
          response.data
        );

      }

    };


  script.onerror =
    function() {

      fail(
        "Could not connect to inventory."
      );

    };


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "_",
    Date.now()
  );


  Object.keys(
    params
  )
    .forEach(
      function(key) {

        const value =
          params[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  script.src =
    API_URL +
    "?" +
    query.toString();


  document.body
    .appendChild(
      script
    );


  setTimeout(
    function() {

      if (!finished) {

        fail(
          "Inventory server timed out."
        );

      }

    },
    15000
  );

}

/* =====================================================
   LOAD INVENTORY
   ===================================================== */

function loadInventory() {

  document
    .getElementById(
      "results"
    )
    .innerHTML =
      '<div class="loading">Loading inventory...</div>';


  callApi(

    "getInventory",

    {},

    function(data) {

      inventory =
        Array.isArray(data)
          ? data
          : [];


      populateOpeningProducts();


      applyProductFilters();

      refreshStockSearch();

    },


    function(error) {

      showError(
        error.message ||
        "Could not load inventory."
      );

    }

  );

}


/* =====================================================
   OPENING STOCK PRODUCT LIST
   ===================================================== */

function populateOpeningProducts() {

  const datalist =
    document
      .getElementById(
        "openingProductList"
      );


  datalist.innerHTML =
    "";


  inventory.forEach(
    function(product) {

      const option =
        document.createElement(
          "option"
        );


      let label =
        String(
          product.product || ""
        );


      if (
        product.variant
      ) {

        label +=
          " — " +
          product.variant;

      }


      option.value =
        label;


      option.dataset.barcode =
        product.barcode;


      datalist.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   OPENING STOCK PRODUCT SELECTION
   ===================================================== */

function selectOpeningProduct() {

  const input =
    document
      .getElementById(
        "openingProductInput"
      );


  const value =
    input.value.trim();


  const selectedBox =
    document
      .getElementById(
        "selectedOpeningProduct"
      );


  selectedOpeningBarcode =
    "";


  selectedBox.style.display =
    "none";


  if (!value) {

    return;

  }


  const options =
    Array.from(

      document
        .getElementById(
          "openingProductList"
        )
        .options

    );


  const option =
    options.find(
      function(item) {

        return (
          item.value ===
          value
        );

      }
    );


  if (!option) {

    return;

  }


  selectedOpeningBarcode =
    option.dataset.barcode ||
    "";


  const product =
    inventory.find(
      function(item) {

        return (

          String(
            item.barcode
          ) ===

          String(
            selectedOpeningBarcode
          )

        );

      }
    );


  if (!product) {

    return;

  }


  selectedBox.innerHTML = `

    <strong>
      ${escapeHTML(
        product.product
      )}
    </strong>

    ${
      product.variant
        ? escapeHTML(
            product.variant
          ) + " · "
        : ""
    }

    Current stock:
    ${Number(
      product.stock
    ) || 0}

  `;


  selectedBox.style.display =
    "block";

}


/* =====================================================
   STOCK SEARCH
   ===================================================== */

function searchStockProducts() {

  const input =
    document
      .getElementById(
        "stockProductSearch"
      );


  const query =
    String(
      input.value || ""
    )
      .trim()
      .toLowerCase();


  const resultsBox =
    document
      .getElementById(
        "stockSearchResults"
      );


  if (!query) {

    resultsBox.innerHTML =
      "";

    resultsBox.style.display =
      "none";

    return;

  }


  const matches =
    inventory.filter(
      function(product) {

        return (

          String(
            product.product || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.barcode || ""
          )
            .toLowerCase()
            .includes(
              query
            )

        );

      }
    )
      .slice(
        0,
        20
      );


  if (
    matches.length === 0
  ) {

    resultsBox.innerHTML = `

      <div
        style="
          padding:12px;
          color:#777;
          font-size:13px;
        "
      >

        No products found.

      </div>

    `;


    resultsBox.style.display =
      "block";

    return;

  }


  resultsBox.innerHTML =
    matches
      .map(
        function(product) {

          const stock =
            Number(
              product.stock
            ) || 0;


          return `

            <button
              class="stock-result"
              type="button"
              onclick="selectStockProduct('${escapeJS(product.barcode)}')">

              <span
                class="stock-result-name">

                ${escapeHTML(
                  product.product
                )}

              </span>


              <span
                class="stock-result-meta">

                ${escapeHTML(
                  product.barcode
                )}

                ${
                  product.variant
                    ? " · " +
                      escapeHTML(
                        product.variant
                      )
                    : ""
                }

                · Stock:
                ${stock}
                ${escapeHTML(
                  STOCK_UNIT
                )}

              </span>

            </button>

          `;

        }
      )
      .join("");


  resultsBox.style.display =
    "block";

}

/* =====================================================
   REFRESH STOCK SEARCH
   ===================================================== */

function refreshStockSearch() {

  /*
   * The selected product remains selected only
   * if it still exists after a stock refresh.
   */

  if (!selectedStockBarcode) {

    return;

  }


  const product =
    inventory.find(
      function(item) {

        return String(
          item.barcode || ""
        )
          .toLowerCase() ===
          String(
            selectedStockBarcode
          )
            .toLowerCase();

      }
    );


  if (!product) {

    clearStockSelection();

    return;

  }


  document
    .getElementById(
      "selectedCurrentStock"
    )
    .innerHTML =

      Number(
        product.stock

      escapeHTML(

      ) +

      "</span>";

}


/* =====================================================
   STATUS
   ===================================================== */

function getStatus(
  product
) {

  const stock =
    Number(
      product.stock
    ) || 0;


  const minimum =
    Number(
      product.minimumStock
    ) || 0;


  if (
    stock <= 0
  ) {

    return {

      text:
        "OUT OF STOCK",

      cls:
        "red"

    };

  }


  if (

    minimum > 0 &&

    stock <= minimum

  ) {

    return {

      text:
        "LOW STOCK",

      cls:
        "orange"

    };

  }


  return {

    text:
      "IN STOCK",

    cls:
      "green"

  };

}


/* =====================================================
   VARIANT
   ===================================================== */

function variantHTML(
  variant
) {

  if (!variant) {

    return "";

  }


  let icon = "";


  if (
    variant ===
    "Light"
  ) {

    icon =
      "☀️";

  }

  else if (
    variant ===
    "Dark"
  ) {

    icon =
      "🌙";

  }

  else if (
    variant ===
    "Highlight"
  ) {

    icon =
      "🖍️";

  }


  return `

    <div class="variant-badge">

      ${icon}

      ${escapeHTML(
        variant
      )}

    </div>

  `;

}


/* =====================================================
   LOW STOCK
   ===================================================== */

function lowStockHTML(
  product
) {

  const stock =
    Number(
      product.stock
    ) || 0;


  const minimum =
    Number(
      product.minimumStock
    ) || 0;


  if (

    stock <= 0 ||

    minimum <= 0 ||

    stock > minimum

  ) {

    return "";

  }


  return `

    <div class="low-stock-badge">

      LOW STOCK · MIN ${minimum}

    </div>

  `;

}


/* =====================================================
   PRODUCT CARD
   ===================================================== */

function productCard(
  product
) {

  const status =
    getStatus(
      product
    );


  const stock =
    Number(
      product.stock
    ) || 0;


  return `

    <div class="product-card">

      <div class="product-name">

        ${escapeHTML(
          product.product
        )}

      </div>


      ${variantHTML(
        product.variant || ""
      )}


      <div class="info">

        <strong>Barcode:</strong>

        ${escapeHTML(
          product.barcode
        )}

      </div>


      <div class="info">

        <strong>Brand:</strong>

        ${escapeHTML(
          product.brand || "-"
        )}

      </div>


      <div class="info">

        <strong>Size:</strong>

        ${escapeHTML(
          product.size || "-"
        )}

      </div>


      <div class="info">

        <strong>Finish:</strong>

        ${escapeHTML(
          product.finish || "-"
        )}

      </div>


      <div class="stock">

        Stock:
        ${stock}

        <span class="stock-unit">

          ${escapeHTML(
            STOCK_UNIT
          )}

        </span>

      </div>


      <div
        class="status ${status.cls}">

        ${status.text}

      </div>

    </div>

  `;

}


/* =====================================================
   RENDER INVENTORY
   ===================================================== */

function renderInventory(
  items
) {

  const results =
    document
      .getElementById(
        "results"
      );


  if (
    !items ||
    items.length === 0
  ) {

    results.innerHTML =

      `

      <div class="product-card">

        No matching products found.

      </div>

      `;

    return;

  }


  results.innerHTML =
    items
      .slice(
        0,
        100
      )
      .map(
        productCard
      )
      .join("");

}


/* =====================================================
   MAIN SEARCH + FILTER
   ===================================================== */

function setStockFilter(
  filter
) {

  activeStockFilter =
    filter;


  document
    .getElementById(
      "filterAll"
    )
    .classList
    .toggle(
      "active",
      filter === "all"
    );


  document
    .getElementById(
      "filterInStock"
    )
    .classList
    .toggle(
      "active",
      filter === "in"
    );


  document
    .getElementById(
      "filterOutStock"
    )
    .classList
    .toggle(
      "active",
      filter === "out"
    );


  applyProductFilters();

}


function searchProducts() {

  applyProductFilters();

}


function applyProductFilters() {

  const query =
    String(

      document
        .getElementById(
          "searchInput"
        )
        .value || ""

    )
      .trim()
      .toLowerCase();


  const filtered =
    inventory.filter(
      function(product) {

        const productName =
          String(
            product.product || ""
          )
            .toLowerCase();


        const barcode =
          String(
            product.barcode || ""
          )
            .toLowerCase();


        const matchesSearch =

          !query ||

          productName.includes(
            query
          ) ||

          barcode.includes(
            query
          );


        if (!matchesSearch) {

          return false;

        }


        const stock =
          Number(
            product.stock
          ) || 0;


        if (
          activeStockFilter ===
          "in"
        ) {

          return stock > 0;

        }


        if (
          activeStockFilter ===
          "out"
        ) {

          return stock <= 0;

        }


        return true;

      }
    );


  renderInventory(
    filtered
  );

}

/* =====================================================
   START SCANNER
   ===================================================== */

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (scanner) {

    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );

    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label ||
          ""
        )
          .toLowerCase();


      if (

        label.includes("back") ||

        label.includes("rear") ||

        label.includes("environment")

      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {

        fps:
          10,

        qrbox: {

          width:
            250,

          height:
            250

        },

        aspectRatio:
          1

      },


      function(decodedText) {

        handleQR(
          decodedText
        );

      },


      function() {

        // Ignore normal scanner errors.

      }

    );


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =

      scannerMode === "stock"

        ? (
            "Scan QR for Stock " +
            (
              stockMode === "in"
                ? "In"
                : "Out"
            ) +
            "."
          )

        : "Point camera at QR code.";

  }


  catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Camera could not start. Please allow camera access.";

  }

}


/* =====================================================
   HANDLE QR
   ===================================================== */

async function handleQR(
  decodedText
) {

  if (
    !scannerRunning
  ) {

    return;

  }


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if (!barcode) {

    return;

  }


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
      "Finding product...";


  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {}

  }


  scannerRunning =
    false;


  /* -----------------------------------------------
     STOCK MODE
     ----------------------------------------------- */

  if (
    scannerMode ===
    "stock"
  ) {

    const product =
      inventory.find(
        function(item) {

          return String(
            item.barcode || ""
          )
            .trim()
            .toLowerCase() ===
            barcode.toLowerCase();

        }
      );


    if (product) {

      selectStockProduct(
        product.barcode
      );


      closeScannerPanel();

      return;

    }


    callApi(

      "findProduct",

      {

        barcode:
          barcode

      },

      function(product) {

        if (!product) {

          closeScannerPanel();

          showStockMessage(
            "Product not found: " +
            barcode
          );

          return;

        }


        /*
         * Add newly fetched product to local
         * inventory cache.
         */

        const existingIndex =
          inventory.findIndex(
            function(item) {

              return String(
                item.barcode
              )
                .toLowerCase() ===
                String(
                  product.barcode
                )
                  .toLowerCase();

            }
          );


        if (
          existingIndex >= 0
        ) {

          inventory[
            existingIndex
          ] = product;

        }

        else {

          inventory.push(
            product
          );

        }


        populateOpeningProducts();


        selectStockProduct(
          product.barcode
        );


        closeScannerPanel();

      },

      function(error) {

        closeScannerPanel();

        showStockMessage(
          error.message ||
          "Could not find product."
        );

      }

    );


    return;

  }


  /* -----------------------------------------------
     NORMAL PRODUCT VIEW MODE
     ----------------------------------------------- */

  document
    .getElementById(
      "adminBarcode"
    );


  const local =
    inventory.find(
      function(product) {

        return String(
          product.barcode ||
          ""
        )
          .trim()
          .toLowerCase() ===
          barcode.toLowerCase();

      }
    );


  if (local) {

    showProduct(
      local
    );


    closeScannerPanel();

    return;

  }


  callApi(

    "findProduct",

    {

      barcode:
        barcode

    },

    function(product) {

      if (!product) {

        closeScannerPanel();

        showError(
          "Product not found: " +
          barcode
        );

        return;

      }


      inventory.push(
        product
      );


      populateOpeningProducts();


      showProduct(
        product
      );


      closeScannerPanel();

    },


    function(error) {

      closeScannerPanel();

      showError(
        error.message ||
        "Could not find product."
      );

    }

  );

}

/* =====================================================
   CLOSE SCANNER
   ===================================================== */

async function closeScanner() {

  if (scanner) {

    try {

      if (
        scannerRunning
      ) {

        await scanner.stop();

      }

    } catch (e) {}


    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    null;


  scannerRunning =
    false;


  scannerMode =
    "normal";

/* =====================================================
   UPDATE LOCAL STOCK
   ===================================================== */

function updateLocalStock(
  barcode,
  newStock,
  status
) {

  const product =
    inventory.find(
      function(item) {

        return String(
          item.barcode || ""
        )
          .toLowerCase() ===
          String(
            barcode || ""
          )
            .toLowerCase();

      }
    );


  if (!product) {

    return;

  }


  product.stock =
    Number(
      newStock
    ) || 0;


  product.status =
    status ||

    getStatus(
      product
    ).text;

}

/* =====================================================
   QR IMAGE
   ===================================================== */

function getQRDataURL_() {

  const canvas =
    document.querySelector(
      "#qrcode canvas"
    );


  if (canvas) {

    return canvas.toDataURL(
      "image/png"
    );

  }


  const img =
    document.querySelector(
      "#qrcode img"
    );


  if (img) {

    return img.src;

  }


  return "";

}


/* =====================================================
   DOWNLOAD QR
   ===================================================== */

function downloadQR() {

  const dataURL =
    getQRDataURL_();


  if (!dataURL) {

    alert(
      "QR code is not ready."
    );

    return;

  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    dataURL;


  link.download =
    (
      currentQRBarcode ||
      "product"
    ) +
    "-QR.png";


  document.body
    .appendChild(
      link
    );


  link.click();

  link.remove();

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE JAVASCRIPT STRING
   ===================================================== */

function escapeJS(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /"/g,
      '\\"'
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(
  message
) {

  document
    .getElementById(
      "results"
    )
    .innerHTML =

      `

      <div class="error">

        ${escapeHTML(
          message
        )}

      </div>

      `;

}


/* =====================================================
   START APP
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    loadApp();

  }
);

</script>
