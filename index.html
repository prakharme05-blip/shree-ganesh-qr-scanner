<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>SHREE GANESH Inventory</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f5f5f5;

      color: #111;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      min-height: 100vh;

    }


    .app {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      padding: 14px;

    }


    /* =================================================
       HEADER
       ================================================= */

    .header {

      background: #111;

      color: white;

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 14px;

    }


    .brand {

      font-size: 25px;

      font-weight: 800;

    }


    .subtitle {

      margin-top: 5px;

      color: #aaa;

      font-size: 13px;

    }


    .mode {

      margin-top: 12px;

      font-size: 13px;

      color: #ddd;

    }


    /* =================================================
       MAIN BUTTONS
       ================================================= */

    .actions {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      margin-bottom: 14px;

    }


    button {

      border: none;

      border-radius: 12px;

      padding: 15px;

      background: #111;

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

    }


    button.secondary {

      background: white;

      color: #111;

      border: 1px solid #ddd;

    }


    button.danger {

      background: #b3261e;

    }


    /* =================================================
       SEARCH
       ================================================= */

    .search-box {

      background: white;

      padding: 14px;

      border-radius: 14px;

      margin-bottom: 14px;

    }


    .search-input {

      width: 100%;

      padding: 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }


    /* =================================================
       SCANNER
       ================================================= */

    .scanner-panel {

      display: none;

      background: white;

      padding: 14px;

      border-radius: 16px;

      margin-bottom: 14px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 12px;

      background: #111;

    }


    .scanner-status {

      text-align: center;

      color: #666;

      font-size: 14px;

      margin-top: 10px;

      min-height: 20px;

    }


    /* =================================================
       PRODUCT
       ================================================= */

    .product-card {

      background: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 12px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.06);

    }


    .product-name {

      font-size: 22px;

      font-weight: 800;

      margin-bottom: 12px;

    }


    .info {

      color: #555;

      font-size: 14px;

      margin: 6px 0;

    }


    .info strong {

      color: #111;

    }


    .stock {

      font-size: 28px;

      font-weight: 800;

      margin-top: 16px;

    }


    .status {

      font-weight: 800;

      margin-top: 4px;

    }


    .green {

      color: #218739;

    }


    .orange {

      color: #a66500;

    }


    .red {

      color: #b12626;

    }


    .scan-next {

      width: 100%;

      margin-top: 15px;

    }


    /* =================================================
       ADMIN
       ================================================= */

    .admin-panel {

      display: none;

      background: white;

      padding: 16px;

      border-radius: 16px;

      margin-bottom: 14px;

    }


    .admin-title {

      font-size: 19px;

      font-weight: 800;

      margin-bottom: 12px;

    }


    .admin-input {

      width: 100%;

      padding: 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      margin-top: 8px;

    }


    .admin-message {

      text-align: center;

      color: #666;

      font-size: 14px;

      margin-top: 10px;

      min-height: 20px;

    }


    /* =================================================
       LOGIN
       ================================================= */

    .login-panel {

      display: none;

      background: white;

      padding: 16px;

      border-radius: 16px;

      margin-bottom: 14px;

    }


    .login-title {

      font-size: 18px;

      font-weight: 800;

      margin-bottom: 10px;

    }


    /* =================================================
       LOADING / ERROR
       ================================================= */

    .loading {

      background: white;

      border-radius: 14px;

      padding: 25px;

      text-align: center;

      color: #777;

    }


    .error {

      background: #fff0f0;

      color: #a00000;

      border-radius: 12px;

      padding: 14px;

      text-align: center;

      margin-bottom: 14px;

    }


    @media (max-width: 600px) {

      .app {

        padding: 12px;

      }

      .actions {

        grid-template-columns:
          1fr 1fr;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- =================================================
       HEADER
       ================================================= -->

  <div class="header">

    <div class="brand">
      SHREE GANESH
    </div>

    <div class="subtitle">
      MARBLES AND GRANITES · INVENTORY
    </div>

    <div
      class="mode"
      id="modeText">

      Staff Mode

    </div>

  </div>


  <!-- =================================================
       MAIN ACTIONS
       ================================================= -->

  <div class="actions">

    <button
      onclick="openScanner()">

      📷<br>
      SCAN QR

    </button>


    <button
      class="secondary"
      onclick="focusSearch()">

      🔎<br>
      SEARCH

    </button>

  </div>


  <!-- =================================================
       LOGIN
       ================================================= -->

  <div
    id="loginPanel"
    class="login-panel">

    <div class="login-title">
      🔐 ADMIN LOGIN
    </div>


    <input
      id="adminPin"
      class="admin-input"
      type="password"
      inputmode="numeric"
      maxlength="8"
      placeholder="Enter Admin PIN"
    >


    <button
      style="margin-top:10px;"
      onclick="adminLogin()">

      UNLOCK ADMIN

    </button>


    <div
      id="loginMessage"
      class="admin-message">
    </div>

  </div>


  <!-- =================================================
       ADMIN BUTTON
       ================================================= -->

  <button
    id="adminLoginButton"
    class="secondary"
    onclick="showAdminLogin()"
    style="width:100%; margin-bottom:14px;">

    🔐 ADMIN LOGIN

  </button>


  <!-- =================================================
       SEARCH
       ================================================= -->

  <div class="search-box">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Search product or barcode..."
      autocomplete="off"
      oninput="searchProducts()"
    >

  </div>


  <!-- =================================================
       SCANNER
       ================================================= -->

  <div
    id="scannerPanel"
    class="scanner-panel">

    <div id="reader"></div>


    <div
      id="scannerStatus"
      class="scanner-status">

      Point the camera at the product QR.

    </div>


    <button
      class="secondary"
      style="width:100%; margin-top:10px;"
      onclick="closeScanner()">

      CLOSE SCANNER

    </button>

  </div>


  <!-- =================================================
       ADMIN PANEL
       ================================================= -->

  <div
    id="adminPanel"
    class="admin-panel">

    <div class="admin-title">
      👑 ADMIN — STOCK UPDATE
    </div>


    <input
      id="adminBarcode"
      class="admin-input"
      placeholder="Product barcode"
      autocomplete="off"
    >


    <input
      id="adminQuantity"
      class="admin-input"
      type="number"
      min="1"
      step="1"
      placeholder="Quantity"
    >


    <button
      style="margin-top:10px;"
      onclick="stockIn()">

      ➕ STOCK IN

    </button>


    <button
      onclick="stockOut()">

      ➖ STOCK OUT

    </button>


    <button
      class="secondary"
      onclick="adminLogout()">

      LOG OUT ADMIN

    </button>


    <div
      id="adminMessage"
      class="admin-message">
    </div>

  </div>


  <!-- =================================================
       RESULTS
       ================================================= -->

  <div id="results">

    <div class="loading">
      Loading inventory...
    </div>

  </div>


</div>


<script>


// =====================================================
// CONFIG
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyPhd5eC7F9lZoPfJ2KyejFVcah7VC-1k4PfmiP7tP-rmnUrlKPiCa_G_8EfrNk6sf-/exec";


let inventory = [];

let scanner = null;

let scannerRunning = false;

let apiCounter = 0;

let adminToken =
  sessionStorage.getItem(
    "sg_admin_token"
  ) || "";


// =====================================================
// JSONP API CLIENT
// =====================================================

function callApi(
  action,
  params,
  success,
  failure
) {

  params =
    params || {};


  const callbackName =
    "sgApi_" +
    Date.now() +
    "_" +
    (++apiCounter);


  let finished = false;


  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  function fail(message) {

    if (finished) {

      return;

    }


    finished = true;

    cleanup();


    if (
      typeof failure ===
      "function"
    ) {

      failure({
        message:
          message ||
          "API request failed."
      });

    }

  }


  window[callbackName] =
    function(response) {

      if (finished) {

        return;

      }


      finished = true;

      cleanup();


      if (
        !response ||
        response.success !== true
      ) {

        if (
          typeof failure ===
          "function"
        ) {

          failure({

            message:
              response &&
              response.error
                ? response.error
                : "API request failed."

          });

        }

        return;

      }


      if (
        typeof success ===
        "function"
      ) {

        success(
          response.data
        );

      }

    };


  script.onerror =
    function() {

      fail(
        "Could not connect to inventory."
      );

    };


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "_",
    Date.now()
  );


  Object.keys(
    params
  )
    .forEach(function(key) {

      const value =
        params[key];


      if (
        value !== undefined &&
        value !== null
      ) {

        query.set(
          key,
          String(value)
        );

      }

    });


  script.src =
    API_URL +
    "?" +
    query.toString();


  document.body
    .appendChild(
      script
    );


  setTimeout(
    function() {

      if (!finished) {

        fail(
          "Inventory server timed out."
        );

      }

    },
    15000
  );

}


// =====================================================
// LOAD APP
// =====================================================

function loadApp() {

  loadInventory();

}


// =====================================================
// LOAD INVENTORY
// =====================================================

function loadInventory() {

  document
    .getElementById(
      "results"
    )
    .innerHTML =
      '<div class="loading">Loading inventory...</div>';


  callApi(

    "getInventory",

    {},

    function(data) {

      inventory =
        Array.isArray(data)
          ? data
          : [];


      renderInventory(
        inventory
      );

    },

    function(error) {

      console.error(
        error
      );


      showError(
        error.message ||
        "Could not load inventory."
      );

    }

  );

}


// =====================================================
// RENDER INVENTORY
// =====================================================

function renderInventory(
  items
) {

  const results =
    document.getElementById(
      "results"
    );


  if (
    !items ||
    items.length === 0
  ) {

    results.innerHTML =
      '<div class="product-card">No products found.</div>';

    return;

  }


  results.innerHTML =
    items
      .slice(
        0,
        100
      )
      .map(
        productCard
      )
      .join("");

}


// =====================================================
// PRODUCT CARD
// =====================================================

function productCard(
  product
) {

  const stock =
    Number(
      product.stock
    ) || 0;


  let status =
    "IN STOCK";


  let color =
    "green";


  if (
    stock <= 0
  ) {

    status =
      "OUT OF STOCK";

    color =
      "red";

  }

  else if (

    Number(
      product.minimumStock
    ) > 0 &&

    stock <=
    Number(
      product.minimumStock
    )

  ) {

    status =
      "LOW STOCK";

    color =
      "orange";

  }


  return `

    <div class="product-card">

      <div class="product-name">

        ${escapeHTML(
          product.product
        )}

      </div>


      <div class="info">

        <strong>Barcode:</strong>
        ${escapeHTML(
          product.barcode
        )}

      </div>


      <div class="info">

        <strong>Brand:</strong>
        ${escapeHTML(
          product.brand || "-"
        )}

      </div>


      <div class="info">

        <strong>Size:</strong>
        ${escapeHTML(
          product.size || "-"
        )}

      </div>


      <div class="info">

        <strong>Finish:</strong>
        ${escapeHTML(
          product.finish || "-"
        )}

      </div>


      <div class="stock">

        Stock: ${stock}

      </div>


      <div
        class="status ${color}">

        ${status}

      </div>

    </div>

  `;

}


// =====================================================
// SEARCH
// =====================================================

function searchProducts() {

  const query =
    String(
      document
        .getElementById(
          "searchInput"
        )
        .value || ""
    )
      .trim()
      .toLowerCase();


  if (!query) {

    renderInventory(
      inventory
    );

    return;

  }


  const filtered =
    inventory.filter(
      function(product) {

        return (

          String(
            product.barcode || ""
          )
            .toLowerCase()
            .includes(query)

          ||

          String(
            product.product || ""
          )
            .toLowerCase()
            .includes(query)

          ||

          String(
            product.brand || ""
          )
            .toLowerCase()
            .includes(query)

          ||

          String(
            product.size || ""
          )
            .toLowerCase()
            .includes(query)

          ||

          String(
            product.finish || ""
          )
            .toLowerCase()
            .includes(query)

        );

      }
    );


  renderInventory(
    filtered
  );

}


// =====================================================
// SEARCH FOCUS
// =====================================================

function focusSearch() {

  document
    .getElementById(
      "searchInput"
    )
    .focus();

}


// =====================================================
// SCANNER
// =====================================================

function openScanner() {

  document
    .getElementById(
      "scannerPanel"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
      "Starting camera...";


  startScanner();

}


// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (scanner) {

    try {

      await scanner.clear();

    }

    catch (e) {}

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );

    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ""
        )
          .toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {

          width: 250,

          height: 250

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        handleQR(
          decodedText
        );

      },

      function(errorMessage) {

        // Ignore scanning errors.

      }

    );


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Point the camera at the product QR.";

  }


  catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Camera could not start. Please allow camera access.";

  }

}


// =====================================================
// HANDLE QR
// =====================================================

async function handleQR(
  decodedText
) {

  if (
    !scannerRunning
  ) {

    return;

  }


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if (!barcode) {

    return;

  }


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
      "Finding product...";


  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (e) {}

  }


  scannerRunning =
    false;


  // Automatically fill Admin barcode
  document
    .getElementById(
      "adminBarcode"
    )
    .value =
      barcode;


  /*
   * Look in local inventory first.
   */

  const local =
    inventory.find(
      function(product) {

        return String(
          product.barcode || ""
        )
          .trim()
          .toLowerCase() ===
          barcode
            .toLowerCase();

      }
    );


  if (local) {

    showProduct(
      local
    );

    closeScannerPanel();

    return;

  }


  /*
   * Ask backend.
   */

  callApi(

    "findProduct",

    {
      barcode:
        barcode
    },

    function(product) {

      if (!product) {

        closeScannerPanel();

        showError(
          "Product not found: " +
          barcode
        );

        return;

      }


      inventory.push(
        product
      );


      showProduct(
        product
      );


      closeScannerPanel();

    },

    function(error) {

      closeScannerPanel();

      showError(
        error.message ||
        "Could not find product."
      );

    }

  );

}


// =====================================================
// SHOW PRODUCT
// =====================================================

function showProduct(
  product
) {

  const results =
    document.getElementById(
      "results"
    );


  const stock =
    Number(
      product.stock
    ) || 0;


  let status =
    "IN STOCK";


  let color =
    "green";


  if (
    stock <= 0
  ) {

    status =
      "OUT OF STOCK";

    color =
      "red";

  }

  else if (

    Number(
      product.minimumStock
    ) > 0 &&

    stock <=
    Number(
      product.minimumStock
    )

  ) {

    status =
      "LOW STOCK";

    color =
      "orange";

  }


  results.innerHTML =

    productCard(
      product
    )

    +

    `

      <button
        class="scan-next"
        onclick="scanNextProduct()">

        📷 SCAN NEXT PRODUCT

      </button>

    `;

}


// =====================================================
// CLOSE SCANNER
// =====================================================

async function closeScanner() {

  if (
    scanner
  ) {

    try {

      if (
        scannerRunning
      ) {

        await scanner.stop();

      }

    }

    catch (e) {}


    try {

      await scanner.clear();

    }

    catch (e) {}

  }


  scanner =
    null;


  scannerRunning =
    false;


  closeScannerPanel();

}


// =====================================================
// CLOSE SCANNER PANEL
// =====================================================

function closeScannerPanel() {

  document
    .getElementById(
      "scannerPanel"
    )
    .style.display =
      "none";

}


// =====================================================
// SCAN NEXT PRODUCT
// =====================================================

async function scanNextProduct() {

  document
    .getElementById(
      "results"
    )
    .innerHTML = "";


  document
    .getElementById(
      "scannerPanel"
    )
    .style.display =
      "block";


  if (scanner) {

    try {

      if (
        scannerRunning
      ) {

        await scanner.stop();

      }

    }

    catch (e) {}


    try {

      await scanner.clear();

    }

    catch (e) {}

  }


  scanner =
    null;


  scannerRunning =
    false;


  startScanner();

}


// =====================================================
// ADMIN LOGIN PANEL
// =====================================================

function showAdminLogin() {

  document
    .getElementById(
      "loginPanel"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "adminPin"
    )
    .focus();

}


// =====================================================
// ADMIN LOGIN
// =====================================================

function adminLogin() {

  const pin =
    document
      .getElementById(
        "adminPin"
      )
      .value
      .trim();


  const message =
    document
      .getElementById(
        "loginMessage"
      );


  if (!pin) {

    message.textContent =
      "Enter Admin PIN.";

    return;

  }


  message.textContent =
    "Checking PIN...";


  callApi(

    "adminLogin",

    {
      pin:
        pin
    },

    function(result) {

      adminToken =
        result.token;


      sessionStorage.setItem(
        "sg_admin_token",
        adminToken
      );


      message.textContent =
        "Admin unlocked.";


      document
        .getElementById(
          "adminPin"
        )
        .value = "";


      document
        .getElementById(
          "loginPanel"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "adminPanel"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "adminLoginButton"
        )
        .style.display =
        "none";


      document
        .getElementById(
          "modeText"
        )
        .textContent =
        "Admin Mode";

    },

    function(error) {

      message.textContent =
        error.message ||
        "Incorrect Admin PIN.";

    }

  );

}


// =====================================================
// ADMIN LOGOUT
// =====================================================

function adminLogout() {

  if (!adminToken) {

    lockAdminUI();

    return;

  }


  callApi(

    "adminLogout",

    {
      token:
        adminToken
    },

    function() {

      lockAdminUI();

    },

    function() {

      lockAdminUI();

    }

  );

}


// =====================================================
// LOCK ADMIN UI
// =====================================================

function lockAdminUI() {

  adminToken = "";

  sessionStorage.removeItem(
    "sg_admin_token"
  );


  document
    .getElementById(
      "adminPanel"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "adminLoginButton"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "modeText"
    )
    .textContent =
    "Staff Mode";


  document
    .getElementById(
      "loginPanel"
    )
    .style.display =
    "none";

}


// =====================================================
// STOCK IN
// =====================================================

function stockIn() {

  if (!adminToken) {

    alert(
      "Please login as Admin first."
    );

    return;

  }


  const barcode =
    document
      .getElementById(
        "adminBarcode"
      )
      .value
      .trim();


  const quantity =
    Number(
      document
        .getElementById(
          "adminQuantity"
        )
        .value
    );


  const message =
    document
      .getElementById(
        "adminMessage"
      );


  if (!barcode) {

    message.textContent =
      "Scan a product or enter a barcode.";

    return;

  }


  if (
    !Number.isFinite(
      quantity
    ) ||
    quantity <= 0
  ) {

    message.textContent =
      "Enter a valid quantity.";

    return;

  }


  message.textContent =
    "Updating stock...";


  callApi(

    "stockIn",

    {

      barcode:
        barcode,

      quantity:
        quantity,

      token:
        adminToken

    },

    function(result) {

      message.textContent =
        "Stock In successful. New stock: " +
        result.newStock;


      document
        .getElementById(
          "adminQuantity"
        )
        .value =
        "";


      loadInventory();

    },

    function(error) {

      message.textContent =
        error.message ||
        "Could not update stock.";


      /*
       * If the session expired,
       * return to Staff mode.
       */

      if (
        String(
          error.message || ""
        )
          .toLowerCase()
          .includes(
            "session expired"
          )
      ) {

        lockAdminUI();

      }

    }

  );

}

// =====================================================
// ERROR
// =====================================================

function showError(
  message
) {

  document
    .getElementById(
      "results"
    )
    .innerHTML =

    `

      <div class="error">

        ${escapeHTML(
          message
        )}

      </div>

    `;

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// =====================================================
// RESTORE ADMIN SESSION
// =====================================================

function restoreAdminSession() {

  if (!adminToken) {

    return;

  }


  /*
   * We don't trust the browser alone.
   *
   * Make a harmless authenticated request.
   */

  callApi(

    "stockIn",

    {

      barcode:
        "__SESSION_CHECK__",

      quantity:
        0,

      token:
        adminToken

    },

    function() {

      /*
       * This should never succeed because
       * quantity is 0, but the session was
       * valid enough to reach validation.
       */

    },

    function(error) {

      const msg =
        String(
          error.message || ""
        )
          .toLowerCase();


      if (
        msg.includes(
          "admin login required"
        ) ||
        msg.includes(
          "session expired"
        )
      ) {

        lockAdminUI();

      }
    }

  );

}

        .getElementById(
          "adminLoginButton"

        .style.display =

      document
        .getElementById(
          "adminPanel"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "modeText"
        )
        .textContent =
        "Admin Mode";

    }


    loadApp();

  }
);

</script>
