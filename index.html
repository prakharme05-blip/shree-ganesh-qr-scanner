<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:Arial,sans-serif;
  min-height:100vh
}
.app{
  max-width:900px;
  margin:auto;
  padding:12px
}
.header{
  background:#111;
  color:#fff;
  border-radius:16px;
  padding:18px;
  margin-bottom:8px
}
.brand{
  font-size:24px;
  font-weight:800
}
.subtitle{
  color:#aaa;
  font-size:12px;
  margin-top:4px
}
.mode{
  color:#ddd;
  font-size:13px;
  margin-top:9px
}
.theme{
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin:6px 0 10px
}
.theme button{
  width:auto;
  padding:7px 9px;
  background:#fff;
  color:#555;
  border:1px solid #ddd
}
.theme button.on{
  background:#111;
  color:#fff
}
button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:800
}
button.secondary{
  background:#fff;
  color:#111;
  border:1px solid #ddd
}
.search,.panel,.scanner,.qr,.card,.loading{
  background:#fff;
  border-radius:15px;
  padding:15px;
  margin-bottom:9px
}
.search input,.panel input,.panel select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-top:7px;
  font-size:15px;
  background:#fff;
  color:#111
}
.tabs,.grid2,.qrgrid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
  margin-bottom:9px
}
.tabs button{
  padding:10px 6px;
  background:#fff;
  color:#666;
  border:1px solid #ddd
}
.tabs button.on{
  background:#111;
  color:#fff
}
.admin{
  margin:2px 0 10px;
  text-align:center
}
.admin button{
  width:auto;
  background:transparent;
  color:#777;
  padding:6px 10px;
  font-size:12px
}
.grid2{
  grid-template-columns:1fr 1fr
}
.greenBtn{
  background:#238636
}
.redBtn{
  background:#c62828
}
.resultList{
  display:none;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:auto;
  max-height:240px;
  margin-top:7px
}
.resultList button{
  background:#fff;
  color:#111;
  border-radius:0;
  text-align:left;
  border-bottom:1px solid #eee;
  padding:11px
}
.resultList small{
  display:block;
  color:#777;
  margin-top:3px
}
.selected{
  display:none;
  background:#f3f3f3;
  border-radius:10px;
  padding:11px;
  margin-top:7px
}
.selected strong{
  display:block
}
.stockNow{
  font-size:21px;
  font-weight:800;
  margin-top:7px
}
.info{
  color:#666;
  font-size:13px;
  margin-top:6px
}
.info b{
  color:#111
}
.name{
  font-size:21px;
  font-weight:800
}
.stock{
  font-size:28px;
  font-weight:800;
  margin-top:14px
}
.unit{
  font-size:12px;
  color:#777
}
.status{
  font-size:13px;
  font-weight:800;
  margin-top:3px
}
.in{
  color:#218739
}
.low{
  color:#a66500
}
.out{
  color:#b12626
}
.variant{
  display:inline-block;
  margin-top:7px;
  background:#eee;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800
}
.lowbadge{
  display:inline-block;
  margin-top:7px;
  background:#fff2d6;
  color:#9a6100;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800
}
.scanner{
  display:none
}
.scannerStatus{
  text-align:center;
  color:#666;
  font-size:13px;
  margin:8px 0
}
.qr{
  display:none;
  text-align:center
}
.qrgrid{
  grid-template-columns:1fr 1fr
}
.msg{
  text-align:center;
  color:#666;
  font-size:13px;
  min-height:18px;
  margin-top:8px
}
.error{
  background:#fff0f0;
  color:#a00000;
  padding:13px;
  border-radius:11px;
  text-align:center
}
.sync{
  display:none;
  background:#111;
  color:#fff;
  border-radius:10px;
  padding:9px;
  font-size:12px;
  text-align:center;
  margin-bottom:8px
}
.sync.show{
  display:block
}
.offline{
  display:none;
  text-align:center;
  color:#777;
  font-size:11px;
  margin-bottom:8px
}
.offline.show{
  display:block
}
body.dark{
  background:#151515;
  color:#eee
}
body.dark .search,
body.dark .panel,
body.dark .scanner,
body.dark .qr,
body.dark .card,
body.dark .loading{
  background:#222;
  color:#eee
}
body.dark .search input,
body.dark .panel input,
body.dark .panel select,
body.dark button.secondary,
body.dark .tabs button{
  background:#171717;
  color:#eee;
  border-color:#444
}
body.dark .tabs button.on{
  background:#fff;
  color:#111
}
body.highlight .card{
  border-left:6px solid #e1a900
}
body.highlight .stock{
  text-decoration:underline
}
@media(max-width:600px){
  .app{
    padding:10px
  }
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="brand">SHREE GANESH</div>
  <div class="subtitle">MARBLES AND GRANITES · INVENTORY</div>
  <div id="mode" class="mode">Staff Mode</div>
</div>

<div class="theme">
  <button id="light" class="on" onclick="theme('light')">☀️</button>
  <button id="dark" onclick="theme('dark')">🌙</button>
  <button id="hi" onclick="theme('highlight')">🖍️</button>
</div>

<div id="offline" class="offline"></div>
<div id="sync" class="sync"></div>

<button onclick="openScan()">📷 SCAN QR</button>

<div class="search">
  <input
    id="q"
    placeholder="Search product or barcode..."
    oninput="render()"
  >
</div>

<div class="tabs">
  <button id="all" class="on" onclick="filter('all')">All</button>
  <button id="inst" onclick="filter('in')">In Stock</button>
  <button id="outst" onclick="filter('out')">Out of Stock</button>
</div>

<div id="adminEntry" class="admin">
  <button onclick="showLogin()">🔐 Admin</button>
</div>

<div id="login" class="panel" style="display:none">
  <b>Admin Login</b>

  <input
    id="pin"
    type="password"
    inputmode="numeric"
    placeholder="Admin PIN"
  >

  <button style="margin-top:8px" onclick="login()">
    UNLOCK ADMIN
  </button>

  <button class="secondary" style="margin-top:7px" onclick="hideLogin()">
    CANCEL
  </button>

  <div id="loginMsg" class="msg"></div>
</div>

<div id="scanner" class="scanner">
  <div id="reader"></div>

  <div id="scannerStatus" class="scannerStatus">
    Starting camera...
  </div>

  <button class="secondary" onclick="closeScanner()">
    CLOSE
  </button>
</div>

<div id="adminPanel" class="panel" style="display:none">

  <b>👑 Admin</b>

  <div class="grid2" style="margin-top:9px">

    <button onclick="openOpening()">
      📦 OPENING STOCK
    </button>

    <button class="greenBtn" onclick="openStock('in')">
      ➕ STOCK IN
    </button>

    <button class="redBtn" onclick="openStock('out')">
      ➖ STOCK OUT
    </button>

    <button class="secondary" onclick="openNew()">
      ➕ ADD NEW MATERIAL
    </button>

    <button class="secondary" onclick="syncNow()">
      ↻ SYNC NOW
    </button>

    <button class="secondary" onclick="logout()">
      LOG OUT
    </button>

  </div>

</div>

<div id="opening" class="panel">

  <b>📦 Opening Stock</b>

  <div style="color:#777;font-size:13px;margin-top:7px">
    Search product name and enter physical register quantity.
  </div>

  <input
    id="opSearch"
    list="products"
    placeholder="Search product name..."
    oninput="pickOpening()"
  >

  <datalist id="products"></datalist>

  <div id="opSelected" class="selected"></div>

  <input
    id="opQty"
    type="number"
    min="0"
    placeholder="Physical opening stock"
  >

  <button style="margin-top:8px" onclick="saveOpening()">
    SAVE OPENING STOCK
  </button>

  <button class="secondary" style="margin-top:7px" onclick="closePanels()">
    CANCEL
  </button>

  <div id="opMsg" class="msg"></div>

</div>

<div id="stockPanel" class="panel">

  <b id="stockTitle">
    Stock
  </b>

  <input
    id="stockSearch"
    placeholder="Search product or barcode..."
    oninput="searchStock()"
  >

  <div id="stockResults" class="resultList"></div>

  <div id="stockSelected" class="selected">

    <strong id="stockName"></strong>

    <div id="stockMeta" class="info"></div>

    <div id="stockNow" class="stockNow"></div>

  </div>

  <button class="secondary" style="margin-top:8px" onclick="openStockScan()">
    📷 SCAN QR
  </button>

  <input
    id="stockQty"
    type="number"
    min="1"
    placeholder="Quantity"
  >

  <button
    id="stockIn"
    class="greenBtn"
    style="margin-top:8px"
    onclick="doStock('in')"
  >
    ➕ STOCK IN
  </button>

  <button
    id="stockOut"
    class="redBtn"
    style="margin-top:8px"
    onclick="doStock('out')"

    ➖ STOCK OUT
  </button>

    class="secondary"
    style="margin-top:7px"
    onclick="closePanels()"
  >
    CANCEL

</div>

<div id="new" class="panel">

  <b>Add New Material</b>

  <input id="nb" placeholder="Barcode">

  <button
    class="secondary"
    style="margin-top:7px"
    onclick="newCode()"

    ⚡ GENERATE INTERNAL CODE
  </button>

  <input id="nbr" placeholder="Brand">
  <input id="ns" placeholder="Size">
  <input id="nf" placeholder="Finish">

  <select id="nv">
    <option value="">Variant</option>
    <option>Light</option>
    <option>Dark</option>
    <option>Highlight</option>
  </select>

  <input id="no" type="number" min="0" placeholder="Opening stock">
  <input id="nm" type="number" min="0" placeholder="Minimum stock">

  <button style="margin-top:8px" onclick="saveNew()">
    SAVE NEW MATERIAL
  </button>

  <button class="secondary" style="margin-top:7px" onclick="closePanels()">
    CANCEL
  </button>

  <div id="newMsg" class="msg"></div>

</div>

<div id="qrPanel" class="qr">

  <b id="qrTitle"></b>

  <div id="qrVar" class="info"></div>
  <div id="qrBar" class="info"></div>

  <div
    id="qrcode"
    style="display:flex;justify-content:center;margin:15px 0"
  ></div>

  <div class="qrgrid">

    <button onclick="printQR()">
      🖨️ PRINT
    </button>

    <button class="secondary" onclick="saveQR()">
      ⬇️ SAVE
    </button>

  </div>

  <button
    class="secondary"
    style="margin-top:7px"
    onclick="document.getElementById('qrPanel').style.display='none'"
  >
    CLOSE
  </button>

</div>

<div id="results">
  <div class="loading">
    Loading inventory...
  </div>
</div>

</div>

<script>
const API="https://script.google.com/macros/s/AKfycbyPhd5eC7F9lZoPfJ2KyejFVcah7VC-1k4PfmiP7tP-rmnUrlKPiCa_G_8EfrNk6sf-/exec",
UNIT="units",
DB="SGInvOffline",
VER=1,
PS="p",
QS="q",
MS="m";

let inv=[],
tok=sessionStorage.getItem("sg_admin_token")||"",
filterMode="all",
selStock="",
selOpen="",
scan=null,
scanning=false,
scanMode="normal",
qrProduct="",
qrCode="",
qrVariant="",
device=localStorage.getItem("sg_device_id")||"";

if(!device){
  device="SG-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
  localStorage.setItem("sg_device_id",device)
}

const $=id=>document.getElementById(id);

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;")
}

function theme(t){
  document.body.classList.toggle("dark",t==="dark");
  document.body.classList.toggle("highlight",t==="highlight");

  localStorage.setItem("sg_theme",t);

  $("light").classList.toggle("on",t==="light");
  $("dark").classList.toggle("on",t==="dark");
  $("hi").classList.toggle("on",t==="highlight")
}

function online(){
  return navigator.onLine
}

function setOffline(){
  const x=$("offline");
  x.classList.toggle("show",!online());
  x.textContent=online()?"":"Offline mode · using saved inventory"
}

function syncMsg(t,c=""){
  const x=$("sync");
  x.textContent=t;
  x.className="sync"+(t?" show ":"")+(c?" "+c:"")
}

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB,VER);

    r.onupgradeneeded=e=>{
      const d=e.target.result;

      if(!d.objectStoreNames.contains(PS))
        d.createObjectStore(PS,{keyPath:"barcode"});

      if(!d.objectStoreNames.contains(QS)){
        const q=d.createObjectStore(QS,{keyPath:"clientTxnId"});
        q.createIndex("createdAt","createdAt")
      }

      if(!d.objectStoreNames.contains(MS))
        d.createObjectStore(MS,{keyPath:"key"})
    };

    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error)
  })
}

async function allP(){
  const d=await openDB();
  return new Promise((res,rej)=>{
    const r=d.transaction(PS).objectStore(PS).getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=()=>rej(r.error)
  })
}

async function putP(list){
  const d=await openDB();

  await new Promise((res,rej)=>{
    const t=d.transaction(PS,"readwrite");
    const s=t.objectStore(PS);

    s.clear();

    list.forEach(x=>{
      if(x&&x.barcode)s.put(x)
    });

    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error)
  })
}

async function allQ(){
  const d=await openDB();

  return new Promise((res,rej)=>{
    const r=d.transaction(QS).objectStore(QS).getAll();

    r.onsuccess=()=>{
      res(
        (r.result||[])
          .sort(
            (a,b)=>a.createdAt-b.createdAt
          )
      )
    };

    r.onerror=()=>rej(r.error)
  })
}

async function putQ(x){
  const d=await openDB();

  return new Promise((res,rej)=>{
    const t=d.transaction(QS,"readwrite");
    t.objectStore(QS).put(x);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error)
  })
}

async function delQ(id){
  const d=await openDB();

  return new Promise((res,rej)=>{
    const t=d.transaction(QS,"readwrite");
    t.objectStore(QS).delete(id);
    t.oncomplete=()=>res();
    t.onerror=()=>rej(t.error)
  })
}

function api(action,p,s,f){
  if(!online()){
    f&&f({offline:true,message:"Offline"});
    return
  }

  const cb=
    "sg"+
    Date.now()+
    Math.random()
      .toString(36)
      .slice(2,6);

  const sc=document.createElement("script");

  let done=false;

  window[cb]=r=>{
    if(done)return;

    done=true;

    sc.remove();

    delete window[cb];

    if(!r||r.success!==true){
      f&&f({
        message:
          r&&r.error||
          "API request failed."
      });
      return
    }

    s&&s(r.data)
  };

  sc.onerror=()=>{
    if(done)return;

    done=true;

    sc.remove();

    delete window[cb];

    f&&f({
      message:
        "Could not connect to inventory."
    })
  };

  const q=
    new URLSearchParams({
      action,
      callback:cb,
      _:Date.now()
    });

  Object.entries(p||{}).forEach(
    ([k,v])=>{
      if(v!=null)q.set(k,String(v))
    }
  );

  sc.src=API+"?"+q;
  document.body.appendChild(sc);

  setTimeout(()=>{
    if(!done){
      done=true;
      sc.remove();
      delete window[cb];

      f&&f({
        message:
          "Inventory server timed out."
      })
    }
  },15000)
}

function render(){
  const q=
    ($("q").value||"")
      .toLowerCase()
      .trim();

  let a=inv.filter(p=>{
    const s=Number(p.stock)||0;

    return (
      (!q||
        (p.product||"")
          .toLowerCase()
          .includes(q)||
        (p.barcode||"")
          .toLowerCase()
          .includes(q)
      )&&
      (
        filterMode==="all"||
        (filterMode==="in"?s>0:s<=0)
      )
    )
  });

  $("results").innerHTML=
    a.length
      ? a.slice(0,100).map(card).join("")
      : '<div class="card">No matching products found.</div>'
}

function filter(f){
  filterMode=f;

  ["all","inst","outst"].forEach(
    (id,i)=>
      $(id).classList.toggle(
        "on",
        ["all","in","out"][i]===f
      )
  );

  render()
}

function card(p){
  const s=Number(p.stock)||0;
  const m=Number(p.minimumStock)||0;

  const st=
    s<=0
      ?["OUT OF STOCK","out"]
      :m>0&&s<=m
        ?["LOW STOCK","low"]
        :["IN STOCK","in"];

  return `
    <div class="card">

      <div class="name">
        ${esc(p.product)}
      </div>

      ${
        p.variant
          ?`
            <div class="variant">
              ${
                p.variant==="Light"
                  ?"☀️"
                  :p.variant==="Dark"
                    ?"🌙"
                    :"🖍️"
              }
              ${esc(p.variant)}
            </div>
          `
          :""
      }

      <div class="info">
        <b>Barcode:</b>
        ${esc(p.barcode)}
      </div>

      <div class="info">
        <b>Brand:</b>
        ${esc(p.brand||"-")}
      </div>

      <div class="info">
        <b>Size:</b>
        ${esc(p.size||"-")}
      </div>

      <div class="info">
        <b>Finish:</b>
        ${esc(p.finish||"-")}
      </div>

      <div class="stock">
        Stock:
        ${s}
        <span class="unit">
          ${UNIT}
        </span>
      </div>

      <div class="status ${st[1]}">
        ${st[0]}
      </div>

      ${
        s>0&&m>0&&s<=m
          ?`
            <div class="lowbadge">
              LOW STOCK · MIN ${m}
            </div>
          `
          :""
      }

    </div>
  `
}

function populate(){
  const d=$("products");

  d.innerHTML="";

  inv.forEach(p=>{
    const o=
      document.createElement("option");

    o.value=
      p.product+
      (p.variant?" — "+p.variant:"");

    o.dataset.barcode=
      p.barcode;

    d.appendChild(o)
  })
}

function pickOpening(){
  const v=
    $("opSearch").value;

  const op=
    [...$("products").options]
      .find(
        x=>x.value===v
      );

  selOpen=
    op
      ?op.dataset.barcode
      :"";

  const p=
    inv.find(
      x=>x.barcode===selOpen
    );

  $("opSelected").style.display=
    p
      ?"block"
      :"none";

  $("opSelected").innerHTML=
    p
      ?`
        <strong>
          ${esc(p.product)}
        </strong>
        Current stock:
        ${p.stock}
      `
      :""
}

function searchStock(){
  const q=
    ($("stockSearch").value||"")
      .toLowerCase()
      .trim();

  const box=$("stockResults");

  if(!q){
    box.style.display="none";
    return
  }

  const a=
    inv
      .filter(
        p=>
          (p.product||"")
            .toLowerCase()
            .includes(q)||
          (p.barcode||"")
            .toLowerCase()
            .includes(q)
      )
      .slice(0,20);

  box.innerHTML=
    a.length
      ?a.map(
        p=>`
          <button
            onclick="selectStock('${String(p.barcode).replace(/'/g,"\\'")}')"
          >

            <b>
              ${esc(p.product)}
            </b>

            <small>
              ${esc(p.barcode)}
              · Stock:
              ${p.stock}
              ${UNIT}
            </small>

          </button>
        `
      ).join("")
      :'<div style="padding:12px;color:#777">No products found.</div>';

  box.style.display="block"
}

function selectStock(b){
  const p=
    inv.find(
      x=>
        String(x.barcode)
          .toLowerCase()===
        String(b)
          .toLowerCase()
    );

  if(!p)return;

  selStock=p.barcode;

  $("stockSearch").value=
    p.product;

  $("stockResults")
    .style.display=
      "none";

  $("stockSelected")
    .style.display=
      "block";

  $("stockName").textContent=
    p.product;

  $("stockMeta").textContent=
    p.barcode+
    (p.variant?" · "+p.variant:"");

  $("stockNow").textContent=
    "Current Stock: "+
    p.stock+
    " "+
    UNIT;

  $("stockQty").focus()
}

function localChange(type,b,q){
  const p=
    inv.find(
      x=>x.barcode===b
    );

  if(!p)return;

  if(type==="in")
    p.stock+=q;
  else
    p.stock=
      Math.max(
        0,
        p.stock-q
      );

  p.status=
    p.stock<=0
      ?"OUT OF STOCK"
      :p.minimumStock>0&&
       p.stock<=p.minimumStock
        ?"LOW STOCK"
        :"IN STOCK";

  render();
  selectStock(b)
}

async function queue(x){
  await putQ(x);
  syncMsg("Pending sync","show")
}

async function syncNow(){
  if(!online()){
    syncMsg(
      "No internet connection",
      "show"
    );
    return
  }

  if(!tok){
    alert(
      "Please login as Admin first."
    );
    return
  }

  const q=
    await allQ();

  if(!q.length){
    syncMsg(
      "✓ Synced",
      "show"
    );

    setTimeout(
      ()=>syncMsg(""),
      1500
    );

    return
  }

  syncMsg(
    "Syncing "+
    q.length+
    " change"+
    (q.length===1?"":"s")+
    "..."
  );

  for(const x of q){
    await new Promise(
      done=>
        api(
          x.type==="stockIn"
            ?"stockIn"
            :x.type==="stockOut"
              ?"stockOut"
              :x.type==="openingStock"
                ?"openingStock"
                :"createProduct",
          {
            ...x,
            token:tok,
            deviceId
          },
          async()=>{
            await delQ(
              x.clientTxnId
            );
            done()
          },
          ()=>{
            done()
          }
        )
    )
  }

  const fresh=
    await new Promise(
      r=>
        api(
          "getInventory",
          {},
          r,
          ()=>r(inv)
        )
    );

  inv=
    Array.isArray(fresh)
      ?fresh
      :inv;

  await putP(inv);

  populate();
  render();

  syncMsg(
    "✓ Synced",
    "show"
  );

  setTimeout(
    ()=>syncMsg(""),
    1800
  )
}

async function saveOpening(){
  if(!selOpen){
    $("opMsg").textContent=
      "Please select a product.";
    return
  }

  const q=
    Number(
      $("opQty").value
    );

  if(
    !Number.isFinite(q)||
    q<0
  ){
    $("opMsg").textContent=
      "Enter a valid opening stock.";
    return
  }

  const x={
    type:"openingStock",
    clientTxnId:txn("opening"),
    createdAt:Date.now(),
    barcode:selOpen,
    quantity:Math.floor(q),
    deviceId
  };

  const p=
    inv.find(
      p=>p.barcode===selOpen
    );

  if(p)p.stock=Math.floor(q);

  await queue(x);

  populate();
  render();

  $("opMsg").textContent=
    "Opening stock saved.";

  await syncNow()
}

async function doStock(type){
  if(!selStock){
    $("stockMsg").textContent=
      "Select a product or scan its QR.";
    return
  }

  const q=
    Math.floor(
      Number(
        $("stockQty").value
      )
    );

  if(
    !Number.isFinite(q)||
    q<=0
  ){
    $("stockMsg").textContent=
      "Enter a valid quantity.";
    return
  }

  const p=
    inv.find(
      x=>x.barcode===selStock
    );

  if(
    type==="out"&&
    q>Number(p.stock||0)
  ){
    $("stockMsg").textContent=
      "Insufficient stock. Available: "+
      p.stock;
    return
  }

  localChange(
    type,
    selStock,
    q
  );

  const x={
    type:
      type==="in"
        ?"stockIn"
        :"stockOut",
    clientTxnId:
      txn(type),
    createdAt:
      Date.now(),
    barcode:
      selStock,
    quantity:
      q,
    deviceId
  };

  await queue(x);

  $("stockQty").value="";

  $("stockMsg").textContent=
    (
      type==="in"
        ?"Stock In"
        :"Stock Out"
    )+
    " saved.";

  await syncNow()
}

function txn(t){
  return(
    device+
    "-"+
    t+
    "-"+
    Date.now()+
    "-"+
    Math.random()
      .toString(36)
      .slice(2,8)
  )
}

function showLogin(){
  $("login").style.display=
    "block";

  $("pin").focus()
}

function hideLogin(){
  $("login").style.display=
    "none"
}

function login(){
  if(!online()){
    $("loginMsg").textContent=
      "Connect to internet for Admin login once.";
    return
  }

  api(
    "adminLogin",
    {
      pin:
        $("pin").value.trim()
    },
    r=>{
      tok=r.token;

      sessionStorage.setItem(
        "sg_admin_token",
        tok
      );

      setAdmin();

      $("pin").value="";

      $("loginMsg").textContent=
        "Admin unlocked.";

      syncNow()
    },
    e=>{
      $("loginMsg").textContent=
        e.message||
        "Login failed."
    }
  )
}

function setAdmin(){
  $("mode").textContent=
    "Admin Mode";

  $("adminEntry").style.display=
    "none";

  $("login").style.display=
    "none";

  $("adminPanel").style.display=
    "block"
}

function validateAdmin(){
  if(!tok){
    $("adminPanel").style.display=
      "none";
    return
  }

  if(!online()){
    setAdmin();
    return
  }

  api(
    "validateAdmin",
    {
      token:tok
    },
    r=>
      r&&r.valid
        ?setAdmin()
        :logout(),
    ()=>setAdmin()
  )
}

function logout(){
  if(!online()){
    tok="";
    sessionStorage.removeItem(
      "sg_admin_token"
    );

    $("adminPanel").style.display=
      "none";

    $("adminEntry").style.display=
      "block";

    $("mode").textContent=
      "Staff Mode";

    return
  }

  api(
    "adminLogout",
    {
      token:tok
    },
    ()=>{
      tok="";

      sessionStorage.removeItem(
        "sg_admin_token"
      );

      $("adminPanel").style.display=
        "none";

      $("adminEntry").style.display=
        "block";

      $("mode").textContent=
        "Staff Mode"
    },
    ()=>{}
  )
}

function newCode(){
  if(!online()){
    const c=
      "SGOFF"+
      Date.now()
        .toString(36)
        .toUpperCase()+
      Math.random()
        .toString(36)
        .slice(2,6)
        .toUpperCase();

    $("nb").value=c;

    $("newMsg").textContent=
      "Offline internal code generated.";

    return
  }

  api(
    "generateInternalBarcode",
    {
      token:tok
    },
    r=>
      $("nb").value=
        r.barcode,
    e=>
      $("newMsg").textContent=
        e.message||
        "Could not generate code."
  )
}

async function saveNew(){
  const b=
    $("nb").value.trim();

  const p=
    $("np").value.trim();

  const brand=
    $("nbr").value.trim();

  const size=
    $("ns").value.trim();

  const finish=
    $("nf").value.trim();

  const v=
    $("nv").value;

  const open=
    Math.floor(
      Number(
        $("no").value
      )
    );

  const min=
    Math.floor(
      Number(
        $("nm").value
      )
    );

  if(!b||!p){
    $("newMsg").textContent=
      "Barcode and product name are required.";
    return
  }

  if(
    !Number.isFinite(open)||
    open<0||
    !Number.isFinite(min)||
    min<0
  ){
    $("newMsg").textContent=
      "Enter valid stock values.";
    return
  }

  const st=
    open<=0
      ?"OUT OF STOCK"
      :min>0&&open<=min
        ?"LOW STOCK"
        :"IN STOCK";

  inv.push({
    barcode:b,
    product:p,
    brand,
    size,
    finish,
    openingStock:open,
    stock:open,
    minimumStock:min,
    variant:v,
    status:st,
    unit:UNIT
  });

  await putP(inv);

  populate();
  render();

  $("newMsg").textContent=
    "Material saved.";

  qr(
    p,
    b,
    v
  );

  const x={
    type:"createProduct",
    clientTxnId:txn("new"),
    createdAt:Date.now(),
    barcode:b,
    product:p,
    brand,
    size,
    finish,
    openingStock:open,
    minimumStock:min,
    variant:v,
    deviceId
  };

  await queue(x);
  await syncNow()
}

function qr(p,b,v){
  qrProduct=p;
  qrCode=b;
  qrVariant=v;

  $("qrTitle").textContent=p;
  $("qrVar").textContent=
    v
      ?"Variant: "+v
      :"";
  $("qrBar").textContent=
    "Barcode: "+b;

  $("qrcode").innerHTML="";

  new QRCode(
    $("qrcode"),
    {
      text:b,
      width:220,
      height:220,
      correctLevel:
        QRCode.CorrectLevel.H
    }
  );

  $("qrPanel").style.display=
    "block"
}

function saveQR(){
  const c=
    $("qrcode")
      .querySelector("canvas");

  const i=
    $("qrcode")
      .querySelector("img");

  const u=
    c
      ?c.toDataURL("image/png")
      :i
        ?i.src
        :"";

  if(!u){
    alert("QR code is not ready.");
    return
  }

  const a=
    document.createElement("a");

  a.href=u;

  a.download=
    (qrCode||"product")+
    "-QR.png";

  a.click()
}

function printQR(){
  const c=
    $("qrcode")
      .querySelector("canvas");

  const i=
    $("qrcode")
      .querySelector("img");

  const u=
    c
      ?c.toDataURL("image/png")
      :i
        ?i.src
        :"";

  if(!u){
    alert("QR code is not ready.");
    return
  }

  const w=
    window.open(
      "",
      "_blank",
      "width=500,height=700"
    );

  if(!w){
    alert("Please allow pop-ups.");
    return
  }

  w.document.write(`
    <style>
      @page{size:80mm 80mm;margin:0}
      body{margin:0;font-family:Arial}
      .l{
        width:80mm;
        min-height:80mm;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        text-align:center
      }
      .q{
        width:48mm;
        height:48mm
      }
    </style>

    <div class=l>
      <b>SHREE GANESH</b>

      <h3>
        ${esc(qrProduct)}
      </h3>

      ${
        qrVariant
          ?`<b>${esc(qrVariant)}</b>`
          :""
      }

      <img class=q src="${u}">

      <b>
        ${esc(qrCode)}
      </b>
    </div>

    <script>
      onload=()=>setTimeout(()=>print(),300)
    <\/script>
  `);

  w.document.close()
}

function openScan(){
  scanMode="normal";

  $("scanner").style.display=
    "block";

  $("scannerStatus").textContent=
    "Starting camera...";

  startScan()
}

function openStockScan(){
  if(!tok){
    alert(
      "Please login as Admin first."
    );
    return
  }

  scanMode="stock";

  $("scanner").style.display=
    "block";

  $("scannerStatus").textContent=
    "Scan product QR.";

  startScan()
}

async function startScan(){
  if(scanning)return;

  if(scan)
    try{
      await scan.clear()
    }catch(e){}

  scan=
    new Html5Qrcode(
      "reader"
    );

  scanning=true;

  try{
    const cams=
      await Html5Qrcode
        .getCameras();

    if(!cams.length)
      throw Error("No camera found.");

    let id=
      cams.find(
        c=>
          /back|rear|environment/i
            .test(c.label||"")
      )?.id||
      cams[0].id;

    await scan.start(
      id,
      {
        fps:10,
        qrbox:{
          width:250,
          height:250
        }
      },
      txt=>
        handleQR(txt),
      ()=>{}
    );

    $("scannerStatus").textContent=
      scanMode==="stock"
        ?"Scan product QR."
        :"Point camera at QR code.";

  }catch(e){
    scanning=false;

    $("scannerStatus").textContent=
      "Camera could not start. Please allow camera access."
  }
}

async function handleQR(txt){
  if(!scanning)return;

  const b=
    String(
      txt||""
    ).trim();

  if(scan)
    try{
      await scan.stop()
    }catch(e){}

  scanning=false;

  if(scanMode==="stock"){

    const p=
      inv.find(
        x=>
          String(x.barcode)
            .toLowerCase()===
          b.toLowerCase()
      );

    if(p){
      selectStock(p.barcode);
      closeScanner();
      return
    }

    if(!online()){
      $("stockMsg").textContent=
        "Product not available in offline cache.";
      closeScanner();
      return
    }

    api(
      "findProduct",
      {
        barcode:b
      },
      p=>{
        if(p){
          inv.push(p);
          selectStock(p.barcode)
        }else{
          $("stockMsg").textContent=
            "Product not found."
        }

        closeScanner()
      },
      e=>{
        $("stockMsg").textContent=
          e.message||
          "Could not find product.";

        closeScanner()
      }
    );

    return
  }

  const p=
    inv.find(
      x=>
        String(x.barcode)
          .toLowerCase()===
        b.toLowerCase()
    );

  if(p){
    $("results").innerHTML=
      card(p);

    closeScanner();
    return
  }

  if(!online()){
    showErr(
      "Product not available in offline cache."
    );

    closeScanner();
    return
  }

  api(
    "findProduct",
    {
      barcode:b
    },
    p=>{
      if(p)
        $("results").innerHTML=
          card(p);
      else
        showErr(
          "Product not found: "+b
        );

      closeScanner()
    },
    e=>{
      showErr(
        e.message||
        "Could not find product."
      );

      closeScanner()
    }
  )
}

async function closeScanner(){
  if(scan){

    try{
      if(scanning)
        await scan.stop()
    }catch(e){}

    try{
      await scan.clear()
    }catch(e){}
  }

  scan=null;
  scanning=false;

  $("scanner").style.display=
    "none"
}

function showErr(m){
  $("results").innerHTML=
    `<div class="error">${esc(m)}</div>`
}

window.addEventListener(
  "online",
  async()=>{
    setOffline();

    if(tok)

);
