* {

  gap: 10px;

}

  font-weight: 800;

.red {

<script>


// =====================================================
// CONFIG
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbyPhd5eC7F9lZoPfJ2KyejFVcah7VC-1k4PfmiP7tP-rmnUrlKPiCa_G_8EfrNk6sf-/exec";


let inventory = [];

let scanner = null;

let scannerRunning = false;

let apiCounter = 0;

let adminToken =
  sessionStorage.getItem(
    "sg_admin_token"
  ) || "";

let currentQRProduct = "";

let currentQRBarcode = "";


// =====================================================
// JSONP CLIENT
// =====================================================

function callApi(
  action,
  params,
  success,
  failure
) {

  params =
    params || {};


  const callbackName =
    "sgApi_" +
    Date.now() +
    "_" +
    (++apiCounter);


  let finished = false;


  const script =
    document.createElement(
      "script"
    );


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  function fail(
    message
  ) {

    if (finished) {
      return;
    }


    finished = true;

    cleanup();


    if (
      typeof failure ===
      "function"
    ) {

      failure({

        message:
          message ||
          "API request failed."

      });

    }

  }


  window[callbackName] =
    function(response) {

      if (finished) {
        return;
      }


      finished = true;

      cleanup();


      if (
        !response ||
        response.success !== true
      ) {

        if (
          typeof failure ===
          "function"
        ) {

          failure({

            message:
              response &&
              response.error
                ? response.error
                : "API request failed."

          });

        }

        return;

      }


      if (
        typeof success ===
        "function"
      ) {

        success(
          response.data
        );

      }

    };


  script.onerror =
    function() {

      fail(
        "Could not connect to inventory."
      );

    };


  const query =
    new URLSearchParams();


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    callbackName
  );


  query.set(
    "_",
    Date.now()
  );


  Object.keys(
    params
  )
    .forEach(
      function(key) {

        const value =
          params[key];


        if (
          value !== undefined &&
          value !== null
        ) {

          query.set(
            key,
            String(value)
          );

        }

      }
    );


  script.src =
    API_URL +
    "?" +
    query.toString();


  document.body
    .appendChild(
      script
    );


  setTimeout(
    function() {

      if (!finished) {

        fail(
          "Inventory server timed out."
        );

      }

    },
    15000
  );

}


// =====================================================
// APP START
// =====================================================

function loadApp() {

  loadInventory();

  validateStoredAdmin();

}


// =====================================================
// INVENTORY
// =====================================================

function loadInventory() {

  document
    .getElementById(
      "results"
    )
    .innerHTML =
      '<div class="loading">Loading inventory...</div>';


  callApi(

    "getInventory",

    {},

    function(data) {

      inventory =
        Array.isArray(data)
          ? data
          : [];


      renderInventory(
        inventory
      );

    },

    function(error) {

      showError(
        error.message ||
        "Could not load inventory."
      );

    }

  );

}


// =====================================================
// STATUS
// =====================================================

function getStatus(
  product
) {

  const stock =
    Number(
      product.stock
    ) || 0;


  const minimum =
    Number(
      product.minimumStock
    ) || 0;


  if (
    stock <= 0
  ) {

    return {

      text:
        "OUT OF STOCK",

      cls:
        "red"

    };

  }


  if (
    minimum > 0 &&
    stock <= minimum
  ) {

    return {

      text:
        "LOW STOCK",

      cls:
        "orange"

    };

  }


  return {

    text:
      "IN STOCK",

    cls:
      "green"

  };

}


// =====================================================
// PRODUCT CARD
// =====================================================

function productCard(
  product
) {

  const status =
    getStatus(
      product
    );


  const stock =
    Number(
      product.stock
    ) || 0;


  return `

    <div class="product-card">

      <div class="product-name">
        ${escapeHTML(
          product.product
        )}
      </div>


      <div class="info">
        <strong>Barcode:</strong>
        ${escapeHTML(
          product.barcode
        )}
      </div>


      <div class="info">
        <strong>Brand:</strong>
        ${escapeHTML(
          product.brand || "-"
        )}
      </div>


      <div class="info">
        <strong>Size:</strong>
        ${escapeHTML(
          product.size || "-"
        )}
      </div>


      <div class="info">
        <strong>Finish:</strong>
        ${escapeHTML(
          product.finish || "-"
        )}
      </div>


      <div class="stock">
        Stock: ${stock}
      </div>


      <div
        class="status ${status.cls}">

        ${status.text}

      </div>

    </div>

  `;

}


// =====================================================
// RENDER INVENTORY
// =====================================================

function renderInventory(
  items
) {

  const results =
    document.getElementById(
      "results"
    );


  if (
    !items ||
    items.length === 0
  ) {

    results.innerHTML =
      '<div class="product-card">No products found.</div>';

    return;

  }


  results.innerHTML =
    items
      .slice(
        0,
        100
      )
      .map(
        productCard
      )
      .join("");

}


// =====================================================
// SEARCH
// =====================================================

function searchProducts() {

  const query =
    String(
      document
        .getElementById(
          "searchInput"
        )
        .value || ""
    )
      .trim()
      .toLowerCase();


  if (!query) {

    renderInventory(
      inventory
    );

    return;

  }


  const filtered =
    inventory.filter(
      function(product) {

        return (

          String(
            product.barcode || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.product || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.brand || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.size || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.finish || ""
          )
            .toLowerCase()
            .includes(
              query
            )

          ||

          String(
            product.variant || ""
          )
            .toLowerCase()
            .includes(
              query
            )

        );

      }
    );


  renderInventory(
    filtered
  );

}


// =====================================================
// SEARCH FOCUS
// =====================================================

function focusSearch() {

  document
    .getElementById(
      "searchInput"
    )
    .focus();

}


// =====================================================
// OPEN SCANNER
// =====================================================

function openScanner() {

  document
    .getElementById(
      "scannerPanel"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
      "Starting camera...";


  startScanner();

}


// =====================================================
// START SCANNER
// =====================================================

async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }


  if (scanner) {

    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scannerRunning =
    true;


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "No camera found."
      );

    }


    let cameraId =
      cameras[0].id;


    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label ||
          ""
        )
          .toLowerCase();


      if (
        label.includes(
          "back"
        ) ||
        label.includes(
          "rear"
        ) ||
        label.includes(
          "environment"
        )
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {

        fps:
          10,

        qrbox: {

          width:
            250,

          height:
            250

        },

        aspectRatio:
          1

      },

      function(decodedText) {

        handleQR(
          decodedText
        );

      },

      function() {

        // Ignore scanning errors.

      }

    );


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Point the camera at the product QR.";

  }


  catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        "scannerStatus"
      )
      .textContent =
      "Camera could not start. Please allow camera access.";

  }

}


// =====================================================
// HANDLE QR
// =====================================================

async function handleQR(
  decodedText
) {

  if (
    !scannerRunning
  ) {

    return;

  }


  const barcode =
    String(
      decodedText || ""
    ).trim();


  if (!barcode) {

    return;

  }


  document
    .getElementById(
      "scannerStatus"
    )
    .textContent =
    "Finding product...";


  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {}

  }


  scannerRunning =
    false;


  // Auto-fill admin field
  document
    .getElementById(
      "adminBarcode"
    )
    .value =
      barcode;


  document
    .getElementById(
      "adjustBarcode"
    )
    .value =
      barcode;


  // Find locally first

  const local =
    inventory.find(
      function(product) {

        return String(
          product.barcode ||
          ""
        )
          .trim()
          .toLowerCase() ===
          barcode.toLowerCase();

      }
    );


  if (local) {

    showProduct(
      local
    );

    closeScannerPanel();

    return;

  }


  // Backend lookup

  callApi(

    "findProduct",

    {

      barcode:
        barcode

    },

    function(product) {

      if (!product) {

        closeScannerPanel();

        showError(
          "Product not found: " +
          barcode
        );

        return;

      }


      inventory.push(
        product
      );


      showProduct(
        product
      );


      closeScannerPanel();

    },

    function(error) {

async function closeScanner() {

  if (scanner) {

    try {

      if (
        scannerRunning
      ) {

        await scanner.stop();

      }

    } catch (e) {}


    try {

      await scanner.clear();

    } catch (e) {}

  }


  scanner =
    null;


  scannerRunning =
    false;


  closeScannerPanel();

}

// =====================================================
// HANDLE ADMIN ERROR
// =====================================================

function handleAdminError(
  error
) {

  const text =
    String(
      error &&
      error.message
        ? error.message
        : ""
    )
      .toLowerCase();


  if (

    text.includes(
      "session expired"
    ) ||

    text.includes(
      "admin login required"
    ) ||

    text.includes(
      "invalid admin session"
    )

  ) {

    lockAdminUI();

  }

}

// =====================================================
// AUTOMATIC QR GENERATION
// =====================================================

function generateProductQR(
  productName,
  barcode
) {

  currentQRProduct =
    productName ||
    "Product";


  currentQRBarcode =
    barcode ||
    "";


  document
    .getElementById(
      "qrTitle"
    )
    .textContent =
    currentQRProduct;


  document
    .getElementById(
      "qrBarcode"
    )
    .textContent =
    "Barcode: " +
    currentQRBarcode;


  const qrBox =
    document.getElementById(
      "qrcode"
    );


  qrBox.innerHTML =
    "";


  if (
    typeof QRCode ===
    "undefined"
  ) {

    document
      .getElementById(
        "qrPanel"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "qrBarcode"
      )
      .textContent =
      "QR library could not load.";

    return;

  }


  new QRCode(

    qrBox,

    {

      text:
        String(
          currentQRBarcode
        ),

      width:
        220,

      height:
        220,

      correctLevel:
        QRCode.CorrectLevel.H

    }

  );


  document
    .getElementById(
      "qrPanel"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "qrPanel"
    )
    .scrollIntoView({

      behavior:
        "smooth",

      block:
        "center"

    });

}

// =====================================================
// GET QR IMAGE
// =====================================================

function getQRDataURL_() {

  const canvas =
    document.querySelector(
      "#qrcode canvas"
    );


  if (canvas) {

    return canvas.toDataURL(
      "image/png"
    );

  }


  const img =
    document.querySelector(
      "#qrcode img"
    );


  if (img) {

    return img.src;

  }


  return "";

}


// =====================================================
// DOWNLOAD QR
// =====================================================

function downloadQR() {

  const dataURL =
    getQRDataURL_();


  if (!dataURL) {

    alert(
      "QR code is not ready."
    );

    return;

  }


  const link =
    document.createElement(
      "a"
    );


  link.href =
    dataURL;


  link.download =
    (
      currentQRBarcode ||
      "product"
    ) +
    "-QR.png";


  document.body
    .appendChild(
      link
    );


  link.click();


  link.remove();

}

// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
